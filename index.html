<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>음료 내기</title>
<style>
:root{
  --bg:#e1d7c2; --paper:#fff; --paper2:#eeefe9; --line:#bfc1b7; --line2:#e5e7e0;
  --fg:#23251d; --fg2:#4d4f46; --fg3:#65675e; --amber:#eb9d2a; --amber-dk:#cd8407;
  --red:#c8442f; --green:#4b8a33;
  --ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
[hidden]{display:none!important}
#app{max-width:560px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px}
h2{margin:0 0 8px;font-size:17px}
h3{margin:0 0 2px;font-size:15.5px}
.sub{color:var(--fg3);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:16px}
.code-in{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:700}
.btn{padding:11px 16px;border-radius:6px;border:1px solid var(--line);background:var(--paper);font-weight:600}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--amber);border-color:var(--amber-dk);color:#2a1d00}
.btn:disabled{opacity:.45}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.full{width:100%}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.volrow{flex:1 1 100%;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg2)}
.volrow input[type=range]{flex:1;accent-color:var(--amber-dk);height:28px}
.volrow #volv{min-width:40px;text-align:right}
.head .row{flex-wrap:nowrap;gap:6px}
.head .btn{white-space:nowrap;padding:6px 9px}
.code{font-size:22px;font-weight:800;letter-spacing:.2em}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9ea096;margin-right:5px}
.dot.on{background:var(--green)}
#banner{background:#fff3cd;border:1px solid #e6c866;border-radius:6px;padding:9px 12px;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--paper2);border:1px solid var(--line2);font-size:13.5px}
.chip.me{border-color:var(--amber-dk);font-weight:700}
.chip.off{opacity:.45}
.chip.ok{background:#e2f0da;border-color:#a9cf97}
.chip.lose{background:#fbe0da;border-color:#e3a89d}
.chip.win{background:#e2f0da;border-color:#a9cf97}
.big{font-size:64px;font-weight:800;text-align:center;margin:6px 0;line-height:1.1}
.center{text-align:center}
.rps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.rps button{font-size:44px;padding:18px 0;border:2px solid var(--line);border-radius:12px;background:#fff;line-height:1}
.rps button small{display:block;font-size:13px;margin-top:6px;color:var(--fg2);font-weight:600}
.rps button.sel{border-color:var(--amber-dk);background:#fff3da;box-shadow:0 0 0 3px rgba(235,157,42,.35)}
.rev{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.rev .chip{font-size:15px;padding:6px 12px}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:10px 0}
.cols button{padding:10px 4px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:700;font-size:15px}
.cols button small{display:block;font-weight:500;color:var(--fg3);font-size:11px;min-height:15px}
.cols button.taken{background:var(--paper2);color:var(--fg3)}
.cols button.mine{border-color:var(--amber-dk);background:#fff3da}
#lscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
canvas{display:block}
.tally{font-size:13px;color:var(--fg2);margin-top:8px}
.win-name{font-size:26px;font-weight:800;color:var(--red);text-align:center;margin:8px 0;line-height:1.3}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:#23251d;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9}
#toast.show{opacity:.95}
select{padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff;flex:1;min-width:0}
/* 메인(게임 선택) / 게임 설정 */
.games4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gbtn{padding:30px 8px;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:8px;line-height:1.3;border-radius:12px}
.gbtn .gi{font-size:40px;line-height:1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.seg button{padding:12px 6px;border:2px solid var(--line);border-radius:10px;background:#fff;font-weight:600;font-size:14px;line-height:1.3}
.seg button small{display:block;font-weight:500;color:var(--fg3);font-size:11.5px;margin-top:3px}
.seg button.on{border-color:var(--amber-dk);background:#fff3da;box-shadow:0 0 0 3px rgba(235,157,42,.3)}
.setup-sec{margin-top:14px}
.rulebar{background:#fff8e8;border:1px solid #f0d9a8;border-radius:12px;padding:10px 12px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.games .wide{grid-column:1 / -1}
/* 퀴즈 */
.qbox{background:#fff3da;border:1px solid var(--amber-dk);border-radius:8px;padding:12px;font-size:18px;font-weight:700;margin:6px 0 10px;word-break:break-word}
.arow{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid var(--line2)}
.arow.ok{background:#e9f4e2}
.arow b{min-width:22px;color:var(--fg3)}
.arow .who{font-weight:700;white-space:nowrap}
.arow .atx{flex:1;word-break:break-word}
.arow button{padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.arow.ok button{background:var(--green);border-color:var(--green);color:#fff}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--amber);color:#2a1d00;font-size:11px;font-weight:700;margin-left:4px}
/* 스피드 */
.spbtn{width:100%;padding:36px 0;font-size:32px;font-weight:800;border-radius:16px;border:3px solid var(--line);background:#e6e6df;color:var(--fg3);margin:8px 0;user-select:none;-webkit-user-select:none}
.spbtn.go{background:var(--red);color:#fff;border-color:#8f2c1b}
.spbtn:disabled{opacity:.7}
.rrow{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px}
.rrow.w{background:#e9f4e2;font-weight:700}
.rrow b{min-width:22px}
.rrow span:last-child{margin-left:auto;color:var(--fg2)}

/* ===== PC 미리보기: 넓은 화면에서 2단 배치 ===== */
@media (min-width:900px){
  body{font-size:16px}
  #app{max-width:1240px;padding:28px 32px 40px}
  #entry{max-width:520px;margin:8vh auto 0;padding:30px}
  #room:not([hidden]){display:grid!important;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"banner banner" "stage head" "stage plist" "lwrap plist";gap:16px;align-items:start}
  #banner{grid-area:banner} .card.head{grid-area:head} #stage{grid-area:stage;min-height:600px;padding:30px 36px} #lwrap{grid-area:lwrap} #plist{grid-area:plist}
  .code{font-size:30px}
  h2{font-size:23px;margin-bottom:12px}
  .sub{font-size:14px}
  .chip{font-size:15px;padding:5px 12px}
  #plist .chips{gap:8px}
  .btn{padding:14px 20px;font-size:16px}
  .btn.sm{padding:8px 12px;font-size:14px}
  .head .btn{padding:8px 12px}
  .games{grid-template-columns:repeat(3,1fr);gap:12px}
  .games .wide{grid-column:auto}
  .games .btn{padding:26px 10px;font-size:18px}
  .games4{grid-template-columns:repeat(4,1fr);gap:16px}
  .gbtn{padding:64px 10px;font-size:22px}
  .gbtn .gi{font-size:60px}
  .seg button{padding:18px 8px;font-size:16px}
  .seg button small{font-size:13px}
  #stage select{max-width:300px;padding:12px;font-size:16px}
  #stage input[type=text]{padding:14px 16px;font-size:17px}
  .big{font-size:140px;margin:18px 0}
  .rps{gap:20px;margin:22px auto;max-width:720px}
  .rps button{font-size:80px;padding:44px 0;border-radius:18px}
  .rps button small{font-size:16px;margin-top:10px}
  .rev .chip{font-size:20px;padding:10px 18px}
  .qbox{font-size:26px;padding:22px 24px}
  .arow{padding:12px 10px;font-size:17px}
  .arow button{padding:8px 16px;font-size:15px}
  .win-name{font-size:40px;margin:18px 0}
  .spbtn{padding:70px 0;font-size:44px;max-width:720px;margin:18px auto;display:block}
  .cols{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px}
  .cols button{padding:16px 4px;font-size:18px}
  .rrow{font-size:17px;padding:9px 12px}
  canvas{margin:0 auto}
}

@media (min-width:900px){
  #stage{min-height:0;padding:36px 44px}
  #app{max-width:1280px}
  #room:not([hidden]){grid-template-columns:minmax(0,1fr) 360px}
  .games{gap:16px}
  .games .btn{padding:58px 10px;font-size:23px;border-radius:12px}
  #stage select{max-width:none;flex:1;padding:14px;font-size:17px}
  #stage input[type=text]{padding:18px 18px;font-size:18px}
  #stage .row .btn{padding:18px 26px;font-size:18px}
  #plist{padding:20px}
  #plist .chip{font-size:17px;padding:8px 16px}
  .card.head{padding:20px}
  .code{font-size:34px}
  .tally{font-size:15px}
  .ladhead{display:none}
  .arow{font-size:18px;padding:14px 12px}
  .qbox{font-size:30px}
  #lwrap{padding:20px}
}

@media (min-width:900px){
  .card.head{flex-wrap:wrap;row-gap:12px}
  .head .row{flex-wrap:wrap}
  .games .btn{font-size:21px;word-break:keep-all}
  #room[data-phase]:not([data-phase="ladder"]):not([data-phase="lpick"]) #stage{min-height:calc(100vh - 72px);display:flex;flex-direction:column;justify-content:center}
  #plist{position:sticky;top:16px}
}

@media (min-width:900px){
  #stage > .rps{width:100%}
  #stage > .btn.sm{align-self:flex-start}
  #stage > .spbtn{width:100%}
  #stage > .qbox{width:100%}
}
</style>
</head>
<body>
<div id="app">

  <!-- 입장 화면 -->
  <section id="entry" class="card">
    <h2>☕ 음료 내기</h2>
    <p class="sub" style="margin:0 0 12px">가위바위보 · 사다리타기 · 퀴즈 · 스피드를 모두가 각자 폰으로 참여해요. (2~30명, 별도 가입 없음)</p>
    <label class="sub">내 이름</label>
    <input type="text" id="name" maxlength="8" placeholder="이름(8자 이내)" autocomplete="off">
    <div style="height:12px"></div>
    <button class="btn pri full" id="create" type="button">방 만들기 (방장)</button>
    <div class="sub center" style="margin:12px 0 6px">또는 방 코드로 참여</div>
    <div class="row" style="flex-wrap:nowrap">
      <input type="text" id="code" class="code-in" maxlength="4" placeholder="CODE" autocomplete="off">
      <button class="btn" id="join" type="button" style="white-space:nowrap">참여</button>
    </div>
    <p class="sub" id="entryMsg" style="margin:10px 0 0;color:var(--red)"></p>
  </section>

  <!-- 방 화면 -->
  <section id="room" hidden style="display:flex;flex-direction:column;gap:12px">
    <div id="banner" hidden></div>
    <div class="card head">
      <div>
        <div class="code" id="rcode"></div>
        <div class="sub"><span class="dot" id="cdot"></span><span id="rcnt"></span></div>
      </div>
      <div class="row">
        <button class="btn sm" id="snd" type="button" aria-label="소리">🔊</button>
        <button class="btn sm" id="share" type="button">링크 복사</button>
        <button class="btn sm" id="leave" type="button">나가기</button>
      </div>
      <div class="volrow"><span id="volico">🔊</span><input type="range" id="vol" min="0" max="100" step="1" aria-label="볼륨"><span id="volv"></span></div>
    </div>
    <div class="card" id="stage"></div>
    <div class="card" id="lwrap" hidden><div id="lscroll"><canvas id="cv"></canvas></div></div>
    <div class="card" id="plist"></div>
  </section>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
/* ============ 설정 ============ */
const MAX = 30, MIN = 2, MAXK = 20;
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const NS = 'bdts-ts1-drink-v1/';
const SHAPES = ['✌️', '✊', '✋'], SHAPE_NAME = ['가위', '바위', '보'];
const RPS_SECS = 5;           /* 가위바위보 선택 제한 시간(초) */
const PICK_SECS = 10;         /* 사다리 번호 선택 · 퀴즈 답변 제한 시간(초) */
const SP_COUNT = 5;           /* 스피드 게임 카운트다운 시작 숫자 */
const GAME_NAME = { rps:'가위바위보', ladder:'사다리타기', quiz:'퀴즈', speed:'스피드' };

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const short = n => n.length > 4 ? n.slice(0,4) + '…' : n;

/* ============ 당첨 규칙 (방장 설정, 모든 게임 공통) ============ */
/* k: 당첨 인원(null이면 참여 인원의 절반), role: 'pay' 당첨자가 쏜다 / 'free' 당첨자는 면제(나머지가 쏜다) */
const cfg = { k:null, role:'pay', lmode:'pick', qn:1 };   /* qn: 퀴즈 문제 수 */   /* lmode: 사다리 이름 배치 pick(각자 고르기) / rand(랜덤) / host(방장이 직접) */
try{
  const r = store.get('ds_role'); if(r === 'pay' || r === 'free') cfg.role = r;
  const m = store.get('ds_lmode'); if(m === 'pick' || m === 'rand' || m === 'host') cfg.lmode = m;
}catch(e){}
const maxK = np => Math.max(1, Math.min(MAXK, np - 1));
const defK = np => Math.max(1, Math.floor(np / 2));
function ruleFor(g, np){
  let k = cfg.k == null ? defK(np) : cfg.k;
  k = Math.max(1, Math.min(k, maxK(np)));
  return { k, role: cfg.role };
}

/* ============ 상태 ============ */
let myId = store.get('ds_id');
if(!myId){ myId = Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-3); store.set('ds_id', myId); }
let myName = store.get('ds_name') || '';
let room = null, isHost = false, S = null, cli = null, brokerIdx = 0;
let connected = false, lastHb = 0, joinedAt = 0, lastJoinSent = 0;
let published = false, collision = false, hbTimer = null;
let myPick = null, mySp = null, seenRk = -1, rkStart = 0;
let qText = '', qDraft = '', qSent = false, qMine = '';
let ladSeen = {}, lastLadIdx = -2;
let cntVal = 0, cntTimer = null, prevPhase = '', lastPhaseR = '', lastStageHtml = '', lastSpSec = -1, lastQc = false;
let sound = store.get('ds_snd') !== '0';
let vol = (() => { const v = parseInt(store.get('ds_vol'), 10); return Number.isFinite(v) ? Math.max(0, Math.min(100, v)) : 60; })();   /* 볼륨 0~100 (100% = 원래 소리의 5배, 컴프레서로 찌그러짐 방지) */
const VOL_MAX = 5, volGain = () => vol / 100 * VOL_MAX;
let setupGame = null;   /* 방장이 지금 설정 중인 게임(내 화면에서만) */
/* 방장 전용(비공개) */
let picks = {}, rpsTimer = null, spRes = {}, spTimer = null, lpTimer = null, qTimer = null, qAns = [], qMark = {};

/* ============ 소리 / 진동 ============ */
let actx = null, noiseBuf = null, master = null;
function ac(){
  try{
    if(!actx){
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = volGain();
      const comp = actx.createDynamicsCompressor();
      comp.threshold.value = -10; comp.knee.value = 8; comp.ratio.value = 12; comp.attack.value = 0.003; comp.release.value = 0.15;
      master.connect(comp); comp.connect(actx.destination);
    }
    if(actx.state === 'suspended') actx.resume();
    return actx;
  }catch(e){ return null; }
}
/* 음 하나: at 초 뒤에 시작, slideTo가 있으면 그 음높이로 미끄러짐 */
function tone(freq, dur, type, vol, at, slideTo){
  if(!sound) return;
  const a = ac(); if(!a) return;
  try{
    const t = a.currentTime + (at || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol || 0.15, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master || a.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }catch(e){}
}
const beep = (freq, dur, type, vol) => tone(freq, dur, type, vol, 0);
/* 잡음(북 스틱·심벌 느낌) */
function noise(dur, vol, at, hp){
  if(!sound) return;
  const a = ac(); if(!a) return;
  try{
    if(!noiseBuf){
      noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
      const d = noiseBuf.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = a.currentTime + (at || 0);
    const src = a.createBufferSource(); src.buffer = noiseBuf;
    const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 1200;
    const g = a.createGain();
    g.gain.setValueAtTime(vol || 0.1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master || a.destination);
    src.start(t); src.stop(t + dur + 0.03);
  }catch(e){}
}
/* 드럼롤: 점점 빨라지고 커짐 */
function drumRoll(ms, vol){
  const v = vol || 0.3; let t = 0, i = 0;
  while(t < ms){
    const p = t / ms;
    noise(0.07, v * (0.35 + 0.65 * p), t / 1000, 700);
    if(i % 2 === 0) tone(95 + 40 * p, 0.09, 'sine', v * 0.9, t / 1000, 60);
    t += 125 - 90 * p; i++;
  }
  noise(0.5, v * 1.1, ms / 1000, 2500);   /* 마지막 심벌 */
}
function heartbeat(at, vol){
  const v = vol || 0.4;
  tone(72, 0.15, 'sine', v, at, 42);
  tone(62, 0.17, 'sine', v * 0.85, (at || 0) + 0.18, 38);
}
function riser(sec, vol){ tone(180, sec, 'sawtooth', vol || 0.05, 0, 1500); noise(sec, (vol || 0.05) * 0.8, 0, 3000); }

/* 화면 꺼짐 방지: 특히 방장 폰이 잠기면 모든 사람의 게임이 멈춤 */
let wakeLock = null;
async function keepAwake(){
  try{
    if(!room || wakeLock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  }catch(e){ wakeLock = null; }
}
function releaseAwake(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null; }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') keepAwake(); });

function startConn(){
  if(cli){ try{ cli.end(true); }catch(e){} cli = null; }
  connected = false; joinedAt = Date.now(); lastHb = 0;
  connect();
}
function connect(){
  const url = BROKERS[brokerIdx % BROKERS.length];
  let ever = false, fails = 0;
  const c = mqtt.connect(url, {
    clientId: 'ds_' + Math.random().toString(36).slice(2,10),
    clean: true, keepalive: 30, connectTimeout: 7000, reconnectPeriod: 2500,
    will: { topic: NS + room + '/a', payload: JSON.stringify({t:'off', id:myId}), qos: 0 }
  });
  cli = c;
  c.on('connect', () => {
    ever = true; fails = 0; connected = true; setConn(true);
    const subs = [NS+room+'/s', NS+room+'/hb'];
    if(isHost) subs.push(NS+room+'/a');
    c.subscribe(subs);
    onConnected();
  });
  c.on('close', () => {
    connected = false; setConn(false);
    if(!ever && ++fails >= 2 && cli === c){ c.end(true); brokerIdx++; connect(); }
  });
  c.on('error', () => {});
  c.on('message', onMsg);
}
function onConnected(){
  if(isHost){
    if(published){ push(); }
    else{
      setTimeout(() => {
        if(!isHost || published) return;
        if(collision){ createRoom(true); return; }
        published = true; push(); startHb();
      }, 1100);
    }
  }else{
    sendJoin();
  }
}
function startHb(){
  clearInterval(hbTimer);
  hbTimer = setInterval(() => pub('hb', {t:Date.now()}), 4000);
  pub('hb', {t:Date.now()});
}
function onMsg(topic, buf){
  const pre = NS + room + '/';
  if(!topic.startsWith(pre)) return;
  const sub = topic.slice(pre.length), txt = buf.toString();
  if(sub === 's'){
    if(!txt){ if(!isHost) closedByHost(); return; }
    let m; try{ m = JSON.parse(txt); }catch(e){ return; }
    onState(m);
  }else if(sub === 'hb'){
    lastHb = Date.now();
  }else if(sub === 'a' && isHost){
    let m; try{ m = JSON.parse(txt); }catch(e){ return; }
    handleAction(m);
  }
}
function sendJoin(){ lastJoinSent = Date.now(); pub('a', {t:'join', id:myId, name:myName}); }

function onState(m){
  if(isHost){ if(!published && m.host !== myId) collision = true; return; }
  if(m.host === myId){ becomeHost(m); return; }
  S = m;
  if(!S.players.some(p => p.id === myId) && onlineCnt() < MAX && Date.now() - lastJoinSent > 2000) sendJoin();

}
function becomeHost(m){

  const p = S.players.find(x => x.id === myId); if(p){ p.on = true; p.name = myName || p.name; }

function uniqueName(n, selfId){
  let base = n, k = 2, cur = n;
  while(S.players.some(p => p.name === cur && p.id !== selfId)) cur = base + k++;
  return cur;

/* 정원이 찼을 때: 이미 나간(오프라인) 사람 중 진행 중인 게임에 끼어 있지 않은 사람의 자리를 비워 줌 */
function evictOffline(){
  const busy = new Set([].concat(S.alive || [], S.rpool || [], (S.lad && S.lad.ids) || [], S.qids || [], (S.sp && S.sp.ids) || []));
  const i = S.players.findIndex(p => !p.on && !p.bot && p.id !== S.host && !busy.has(p.id));
  if(i < 0) return false;
  S.players.splice(i, 1);
  return true;
}

function handleAction(m){
  if(!isHost || !S || !m || !m.id) return;
  const id = m.id;
  switch(m.t){
    case 'join': {
      const p = pl(id);
      if(p){ p.on = true; if(m.name && m.name !== p.name) p.name = uniqueName(String(m.name).slice(0,8), id); }
      else{
        if(S.players.length >= MAX && !evictOffline()) return;
        S.players.push({ id, name: uniqueName(String(m.name||'?').slice(0,8)), on:true });
      }
      push(); break;
    }
    case 'off': {
      const p = pl(id);
      if(p){ p.on = false; push(); if(S.phase==='rps') checkRpsAll(); if(S.phase==='lpick') checkLadderAll(); if(S.phase==='speed') checkSpeedAll(); }
      break;
    }
    case 'pick': rpsPick(id, m.c); break;
    case 'col': ladderCol(id, m.c); break;
    case 'ans': quizAnswer(id, m.text); break;
    case 'sp': speedPress(id, m.rt); break;
  }
}

function resetToLobby(){

/* ----- 연습 모드: 사람이 방장 1명뿐이면 '연습봇'이 함께 참여 ----- */

const botWait = (fn, ms) => setTimeout(() => { try{ fn(); }catch(e){} }, ms);
function botRps(){ if(pl(BOT) && S.alive.includes(BOT)) botWait(() => rpsPick(BOT, Math.floor(Math.random()*3)), 700 + Math.random()*2200); }

    if(free.length) ladderCol(BOT, free[Math.floor(Math.random()*free.length)]);

/* 게임 종료 공통: winners=당첨자, pool=참여자. role에 따라 쏘는 사람(payers)이 정해짐 */
function finishGame(game, winners, pool, extra){
  const role = S.rule ? S.rule.role : 'pay';
  const none = winners.length === 0;
  const payers = none ? [] : (role === 'pay' ? winners.slice() : pool.filter(id => !winners.includes(id)));
  S.phase = 'result';
  S.result = Object.assign({ game, winners, pool, payers, role, void: none }, extra || {});
  payers.forEach(id => { S.buys[id] = (S.buys[id] || 0) + 1; });
  push();
}

/* ----- 가위바위보: 당첨(=진 사람) k명을 가릴 때까지 ----- */
function startRps(){
  ensureBot();
  const ps = S.players.filter(p => p.on);
  if(ps.length < MIN){ toast('최소 2명이 필요해요'); return; }
  const ids = ps.map(p => p.id);
  S.rule = ruleFor('rps', ids.length);
  S.game = 'rps'; S.alive = ids.slice(); S.rpool = ids.slice(); S.conf = []; S.need = S.rule.k;
  S.round = 1; S.result = null; S.note = '';
  nextRpsRound();
}
function nextRpsRound(){
  picks = {}; S.rk++; S.picked = []; S.reveal = null; S.phase = 'rps'; S.secs = RPS_SECS;
  clearTimeout(rpsTimer); rpsTimer = setTimeout(resolveRps, RPS_SECS * 1000 + 1200);
  push(); botRps();
}
function rpsPick(id, c){
  if(S.phase !== 'rps' || !S.alive.includes(id) || ![0,1,2].includes(c)) return;
  picks[id] = c;
  S.picked = Object.keys(picks); push();
  checkRpsAll();
}
function checkRpsAll(){
  if(S.phase !== 'rps') return;
  const need = S.alive.filter(id => pl(id) && pl(id).on);
  if(need.every(id => picks[id] != null)) setTimeout(() => { if(S.phase === 'rps') resolveRps(); }, 500);
}
function resolveRps(){
  if(S.phase !== 'rps') return;
  clearTimeout(rpsTimer);
  const alive = S.alive;
  alive.forEach(id => { if(picks[id] == null) picks[id] = rnd(3); });
  S.phase = 'count'; S.picked = alive.slice(); push();
  setTimeout(() => {
    const ch = Object.assign({}, picks);
    const sh = [...new Set(alive.map(id => ch[id]))];
    let out = 'draw', losers = [], safe = [], pair = null;
    if(sh.length === 3 && alive.length >= 5){
      /* 인원이 많으면 3가지 모양이 거의 항상 나와 승부가 안 남 → 두 모양만 무작위로 대결 */
      const skip = rnd(3);
      pair = sh.filter(s => s !== skip).sort();
      const [x, y] = pair;
      const w = ((x - y + 3) % 3 === 1) ? x : y;
      const lsh = (w === x) ? y : x;
      losers = alive.filter(id => ch[id] === lsh);
    }else if(sh.length === 2){
      const [x, y] = sh;
      const w = ((x - y + 3) % 3 === 1) ? x : y;
      losers = alive.filter(id => ch[id] !== w);
    }
    if(losers.length){
      safe = alive.filter(id => !losers.includes(id));
      if(losers.length === S.need) out = 'final';       /* 정확히 필요한 인원 */
      else if(losers.length < S.need) out = 'part';     /* 진 사람은 확정, 이긴 사람들끼리 나머지 가림 */
      else out = 'next';                                /* 너무 많이 짐 → 진 사람들끼리 다시 */
    }
    S.phase = 'reveal'; S.reveal = { choices: ch, out, losers, safe, pair, need: S.need }; push();
    setTimeout(() => {
      if(out === 'draw'){ S.note = '비겼어요! 같은 멤버로 다시'; nextRpsRound(); }
      else if(out === 'final'){ finishGame('rps', S.conf.concat(losers), S.rpool, {}); }
      else if(out === 'part'){
        S.conf = S.conf.concat(losers); S.need -= losers.length; S.alive = safe; S.round++;
        S.note = `${losers.length}명 확정! 남은 ${S.need}명을 더 가려요`; nextRpsRound();
      }else{
        S.alive = losers; S.round++; S.note = `진 ${losers.length}명끼리 계속!`; nextRpsRound();
      }
    }, 5200);
  }, 3300);
}

/* ----- 사다리타기 ----- */
function startLadder(){
  ensureBot();
  const ps = S.players.filter(p => p.on);
  if(ps.length < MIN){ toast('최소 2명이 필요해요'); return; }
  const N = ps.length;
  S.rule = ruleFor('ladder', N);
  S.game = 'ladder'; S.result = null; S.phase = 'lpick';
  const ids = ps.map(p => p.id), mode = cfg.lmode;
  S.lad = { N, ids, k: S.rule.k, slots: {}, mode };
  S.rk++; clearTimeout(lpTimer);
  if(mode === 'rand'){ ladderRun(); return; }                         /* 랜덤 배치: 바로 사다리 공개 */
  if(mode === 'host'){ S.lad.arr = ids.slice(); push(); return; }     /* 방장이 직접 배치: 방장이 시작할 때까지 대기 */
  S.secs = PICK_SECS;
  lpTimer = setTimeout(() => { if(S.phase === 'lpick') ladderRun(); }, PICK_SECS * 1000 + 1200);   /* 시간 안에 못 고른 사람은 랜덤 배정 */
  push(); botLadder();
}
function ladderCol(id, c){
  if(S.phase !== 'lpick' || S.lad.mode !== 'pick' || !S.lad.ids.includes(id)) return;
  const L = S.lad;
  if(!Number.isInteger(c) || c < 0 || c >= L.N) return;
  if(Object.entries(L.slots).some(([i, v]) => v === c && i !== id)) return;
  L.slots[id] = c; push(); checkLadderAll();
}
function checkLadderAll(){
  if(S.phase !== 'lpick' || S.lad.mode !== 'pick') return;
  const L = S.lad;
  const need = L.ids.filter(id => pl(id) && pl(id).on);
  if(need.every(id => L.slots[id] != null)) setTimeout(() => { if(S.phase === 'lpick') ladderRun(); }, 700);
}
function moveLad(id, d){
  if(!isHost || S.phase !== 'lpick' || S.lad.mode !== 'host') return;
  const a = S.lad.arr, i = a.indexOf(id), j = i + d;
  if(i < 0 || j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]]; push();
}
function shuffleLad(){
  if(!isHost || S.phase !== 'lpick' || S.lad.mode !== 'host') return;
  S.lad.arr = shuffle(S.lad.arr); push();
}
function startLadHost(){
  if(!isHost || S.phase !== 'lpick' || S.lad.mode !== 'host') return;
  S.lad.arr.forEach((id, i) => { S.lad.slots[id] = i; });
  ladderRun();
}
function ladPath(L, c){
  const pts = [[c, 0]];
  for(let r = 0; r < L.rungs.length; r++){
    const row = L.rungs[r]; let n = c;
    if(row.includes(c)) n = c + 1; else if(row.includes(c - 1)) n = c - 1;
    if(n !== c){ pts.push([c, r + .5], [n, r + .5]); c = n; }
  }
  pts.push([c, L.rungs.length]);
  return { pts, end: c };
}
function ladderRun(){
  if(S.phase !== 'lpick') return;
  clearTimeout(lpTimer);
  const L = S.lad, N = L.N;
  const used = new Set(Object.values(L.slots));
  const free = shuffle([...Array(N).keys()].filter(c => !used.has(c)));
  L.ids.forEach(id => { if(L.slots[id] == null) L.slots[id] = free.pop(); });
  const rows = Math.max(16, Math.min(26, N * 2));
  L.rungs = [];
  for(let r = 0; r < rows; r++){
    const row = [];
    for(let c = 0; c < N - 1; c++){
      if(row.includes(c - 1)) continue;
      if(Math.random() < .45) row.push(c);
    }
    L.rungs.push(row);
  }
  L.bot = Array(N).fill(0);
  shuffle([...Array(N).keys()]).slice(0, L.k).forEach(c => L.bot[c] = 1);
  L.order = shuffle(L.ids); L.idx = -1; L.res = {}; L.dur = 0;
  S.phase = 'ladder'; push();
  setTimeout(ladStep, 2500);
}
function ladStep(){
  if(S.phase !== 'ladder') return;
  const L = S.lad;
  const hits = Object.values(L.res).filter(v => v === 'hit').length;
  if(L.idx + 1 >= L.order.length || hits >= L.k){ ladFinish(); return; }
  L.idx++;
  const left = L.order.length - L.idx - 1;
  L.dur = left <= 1 ? 4200 : (L.N <= 8 ? 3500 : (L.N <= 16 ? 2000 : 1300));
  const gap = L.N > 16 ? 900 : 1400;
  push();
  setTimeout(() => {
    const id = L.order[L.idx];
    L.res[id] = L.bot[ladPath(L, L.slots[id]).end] ? 'hit' : 'pass';
    push();
    setTimeout(ladStep, gap);
  }, L.dur + 500);
}
function ladFinish(){
  const L = S.lad;
  L.ids.forEach(id => { if(!L.res[id]) L.res[id] = L.bot[ladPath(L, L.slots[id]).end] ? 'hit' : 'pass'; });
  L.done = true;
  finishGame('ladder', L.ids.filter(id => L.res[id] === 'hit'), L.ids, {});
}

/* ----- 퀴즈: 방장이 문제를 내고, 빨리 낸 순서대로 답변이 쌓임. 방장이 정답자를 고름 ----- */
function startQuiz(next){
  ensureBot();
  const text = qText.trim();
  if(!text){ toast('문제를 입력해 주세요'); return; }
  const ids = S.players.filter(p => p.on && p.id !== myId).map(p => p.id);
  if(ids.length < 1){ toast('답변할 사람이 필요해요'); return; }
  qText = '';
  if(next && S.qs) S.qs.i++; else S.qs = { n: cfg.qn, i: 1 };      /* 문제 시리즈: n문제 중 i번째 */
  S.rule = ruleFor('quiz', ids.length);
  S.game = 'quiz'; S.qids = ids; S.q = { text: text.slice(0,80), subs: [], closed: false }; S.secs = PICK_SECS;
  qAns = []; qMark = {};
  S.rk++; S.picked = []; S.phase = 'quiz'; S.result = null;
  clearTimeout(qTimer); qTimer = setTimeout(closeQuiz, PICK_SECS * 1000 + 1200);
  push(); botQuiz();
}
function closeQuiz(){
  if(S.phase !== 'quiz' || S.q.closed) return;
  clearTimeout(qTimer); S.q.closed = true; push();
}
function quizAnswer(id, text){
  if(S.phase !== 'quiz' || S.q.closed || !S.qids || !S.qids.includes(id) || S.q.subs.includes(id)) return;
  const t = String(text || '').trim().slice(0, 60);
  if(!t) return;
  qAns.push({ id, text: t });          /* 답변 내용은 방장 기기에만 보관 (다른 사람이 베끼지 못하게) */
  S.q.subs.push(id); S.picked = S.q.subs.slice();
  push();
  if(S.qids.filter(i => pl(i) && pl(i).on).every(i => S.q.subs.includes(i))) closeQuiz();   /* 전원 제출하면 바로 마감 */
}
function quizWinners(){
  return qAns.filter(a => qMark[a.id]).slice(0, S.rule.k).map(a => a.id);   /* 정답자 중 빨리 낸 순서대로 k명 */
}
function finishQuiz(){
  if(S.phase !== 'quiz') return;
  clearTimeout(qTimer);
  const winners = quizWinners();
  finishGame('quiz', winners, S.qids, {
    q: S.q.text,
    answers: qAns.map(a => ({ id: a.id, text: a.text, ok: !!qMark[a.id] }))
  });
}

/* ----- 스피드: 5→0 카운트다운, 0이 된 뒤 가장 빨리 '당첨!' 버튼 누르기 ----- */
function startSpeed(){
  ensureBot();
  const ps = S.players.filter(p => p.on);
  if(ps.length < MIN){ toast('최소 2명이 필요해요'); return; }
  const ids = ps.map(p => p.id);
  S.rule = ruleFor('speed', ids.length);
  S.game = 'speed'; S.sp = { ids }; spRes = {};
  S.rk++; S.picked = []; S.phase = 'speed'; S.result = null;
  clearTimeout(spTimer); spTimer = setTimeout(resolveSpeed, SP_COUNT * 1000 + 1500 + 2500);
  push(); botSpeed();
}
function speedPress(id, rt){
  if(S.phase !== 'speed' || !S.sp.ids.includes(id) || spRes[id] != null) return;
  spRes[id] = (Number.isFinite(rt) && rt >= 0) ? Math.round(rt) : -1;     /* -1 = 0초 전에 눌러서 실격 */
  S.picked = Object.keys(spRes); push();
  checkSpeedAll();
}
function checkSpeedAll(){
  if(S.phase !== 'speed') return;
  const need = S.sp.ids.filter(id => pl(id) && pl(id).on);
  if(need.every(id => spRes[id] != null)) setTimeout(() => { if(S.phase === 'speed') resolveSpeed(); }, 700);
}
function resolveSpeed(){
  if(S.phase !== 'speed') return;
  clearTimeout(spTimer);
  const ids = S.sp.ids;
  const valid = ids.filter(id => spRes[id] != null && spRes[id] >= 0).sort((a, b) => spRes[a] - spRes[b]);
  const winners = valid.slice(0, S.rule.k);
  finishGame('speed', winners, ids, {
    rank: valid.map(id => ({ id, ms: spRes[id] })),
    fouls: ids.filter(id => spRes[id] != null && spRes[id] < 0),
    miss: ids.filter(id => spRes[id] == null)
  });
}
function spState(){
  const left = rkStart + SP_COUNT * 1000 - Date.now();
  return { sec: left > 0 ? Math.ceil(left / 1000) : 0, go: left <= 0 };
}
function speedPressLocal(){
  if(!S || S.phase !== 'speed' || mySp || !S.sp || !S.sp.ids.includes(myId)) return;
  const rt = Date.now() - (rkStart + SP_COUNT * 1000);
  if(rt < 0){ if(!act({ t:'sp', rt:-1 })) return; mySp = { foul:true }; beep(200, .3, 'sawtooth', .2); vib([60,40,60]); }
  else{ if(!act({ t:'sp', rt })) return; mySp = { ms: Math.round(rt) }; beep(880, .1); vib(40); }
  render();
}

  if(!S){ $('#stage').innerHTML = '<div class="center sub" style="padding:18px">방에 연결하는 중…</div>'; $('#plist').innerHTML=''; $('#rcnt').textContent=''; lastStageHtml=''; return; }
  if(S.rk !== seenRk){
    seenRk = S.rk; rkStart = Date.now();
    myPick = null; mySp = null; qSent = false; qDraft = ''; qMine = ''; lastSpSec = -1;
  }
  const online = S.players.filter(p => p.on).length;
  $('#rcnt').textContent = `접속 ${online}/${MAX}명`;

  /* 단계 전환 효과 */
  if(S.phase !== prevPhase){
    if(S.phase === 'count'){ startCount(); drumRoll(3200, .32); }            /* 공개 직전 드럼롤 */
    if(S.phase === 'reveal'){ revealSound(S.reveal); vib(120); }
    if(S.phase === 'quiz') beep(660, .2, 'triangle', .2);
    if(S.phase === 'speed') riser(SP_COUNT, .06);
    if(S.phase === 'ladder'){ riser(2.4, .05); drumRoll(2400, .22); }        /* 사다리 공개 */
    if(S.phase === 'result'){ resultSound(S.result); vib([200,80,200]); }
    if(S.phase !== 'ladder'){ ladSeen = {}; lastLadIdx = -2; }
    prevPhase = S.phase;
  }
  if(S.phase === 'ladder' && S.lad && S.lad.rungs) ladderSounds();

  let h = '';
  switch(S.phase){
    case 'lobby': h = lobbyHtml(); break;
    case 'rps': h = rpsHtml(); break;
    case 'count': h = `<h2>${S.game==='rps'?'가위바위보 ':''}공개 직전…</h2><div class="big pulse" id="cnt">${cntVal||''}</div><div class="center sub">모두 선택 완료! 곧 동시에 공개돼요</div>`; break;
    case 'reveal': h = revealHtml(); break;
    case 'lpick': h = lpickHtml(); break;
    case 'ladder': h = ladderHtml(); break;
    case 'quiz': h = quizHtml(); break;
    case 'speed': h = speedHtml(); break;
    case 'result': h = resultHtml(); break;
  }
  /* 입력창/선택창을 쓰는 중이면 화면을 갈아엎지 않음(입력 내용·펼친 목록 유지) */
  const ae = document.activeElement;
  const typing = ae && $('#stage').contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName);
  const qc = !!(S.phase === 'quiz' && S.q && S.q.closed), qcChanged = qc !== lastQc; lastQc = qc;
  if(qc && qcChanged) timeUp();
  if(typing && S.phase === lastPhaseR && !qcChanged) syncStage(h);     /* 입력 중에도 버튼 활성화/선택지는 최신으로 맞춤 */
  else if(h !== lastStageHtml){ $('#stage').innerHTML = h; lastStageHtml = h; }
  lastPhaseR = S.phase;
  $('#room').dataset.phase = S.phase;

  /* 사다리 캔버스 */
  const showLad = (S.phase === 'ladder' || (S.phase === 'result' && S.lad && S.lad.rungs));
  $('#lwrap').hidden = !showLad;
  if(showLad) ladderUpdate();

  /* 참가자 목록 */
  const picked = (S.phase === 'rps' || S.phase === 'speed') ? (S.picked || []) : (S.phase === 'quiz' && S.q ? S.q.subs : []);
  $('#plist').innerHTML = `<div class="sub" style="margin-bottom:6px">참가자 ${S.players.length}명</div><div class="chips">` +
    S.players.map(p => {
      const crown = p.id === S.host ? '👑 ' : '';
      const ok = picked.includes(p.id) ? ' ✓' : '';
      return `<span class="chip ${p.id===myId?'me':''} ${p.on?'':'off'} ${ok?'ok':''}">${crown}${esc(p.name)}${ok}</span>`;
    }).join('') + '</div>';
  updateBanner();
}

/* 입력/선택 중일 땐 화면을 통째로 바꾸지 않고, 시작 버튼의 활성 여부와 드롭다운 목록만 갱신 */
function syncStage(h){
  const tmp = document.createElement('div'); tmp.innerHTML = h;
  const st = $('#stage'), ae = document.activeElement;
  tmp.querySelectorAll('button[data-a], button[data-go]').forEach(nb => {
    const cb = st.querySelector(nb.dataset.a != null ? `button[data-a="${nb.dataset.a}"]` : `button[data-go="${nb.dataset.go}"]`);
    if(cb) cb.disabled = nb.disabled;
  });
  tmp.querySelectorAll('select[data-cfg]').forEach(ns => {
    const cs = st.querySelector(`select[data-cfg="${ns.dataset.cfg}"]`);
    if(cs && cs !== ae) cs.innerHTML = ns.innerHTML;
  });
  const nh = tmp.querySelector('[data-sync="hint"]'), ch = st.querySelector('[data-sync="hint"]');
  if(ch && !nh) ch.remove();
}

  else msg = `당첨 ${S.conf.length + R.losers.length}명이 모두 정해졌어요…`;
  if(R.pair) msg = `세 모양이 다 나와서 랜덤으로 ${SHAPES[R.pair[0]]} vs ${SHAPES[R.pair[1]]} 대결! ` + msg;
  return `<h2 class="center">${label}</h2><div class="rev">${cards}</div><div class="center sub">${msg}</div>`;
}

/* ============ 사다리 캔버스 ============ */
const cv = $('#cv'), ctx = cv.getContext('2d');
let animIdx = -2, animT0 = 0, rafOn = false;

function ladderUpdate(){
  const L = S.lad; if(!L || !L.rungs) return;
  if(S.phase === 'ladder' && L.idx >= 0 && L.idx !== animIdx && !L.res[L.order[L.idx]]){
    animIdx = L.idx; animT0 = performance.now();
  }
  if(S.phase === 'ladder' && L.idx < 0) animIdx = -1;
  drawLadder(performance.now());
  if(!rafOn){ rafOn = true; requestAnimationFrame(tick); }
}
function tick(t){
  rafOn = false;
  if(!S || !S.lad || !S.lad.rungs || $('#lwrap').hidden) return;
  const L = S.lad;
  const active = S.phase === 'ladder' && L.idx >= 0 && !L.res[L.order[L.idx]];
  drawLadder(t);
  if(active){ rafOn = true; requestAnimationFrame(tick); }
}
function drawLadder(now){
  const L = S.lad; if(!L || !L.rungs) return;
  const N = L.N, rows = L.rungs.length;
  const wrapW = $('#lscroll').clientWidth || 320;
  const colW = (N * 44 <= wrapW) ? Math.min(wrapW / N, 140) : 44;
  const top = 38, bot = 44, rowH = wrapW > 700 ? 28 : 16;
  const W = Math.ceil(colW * N), H = top + rows * rowH + bot;
  const dpr = window.devicePixelRatio || 1;
  if(cv.width !== W * dpr || cv.height !== H * dpr){
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const X = c => colW * (c + .5), Y = r => top + r * rowH;
  const idOfCol = {}; Object.entries(L.slots).forEach(([id, c]) => idOfCol[c] = id);

  /* 세로선 / 가로선 */
  ctx.lineWidth = 2; ctx.strokeStyle = '#bfc1b7'; ctx.lineCap = 'round';
  for(let c = 0; c < N; c++){ ctx.beginPath(); ctx.moveTo(X(c), Y(0)); ctx.lineTo(X(c), Y(rows)); ctx.stroke(); }
  L.rungs.forEach((row, r) => row.forEach(c => { ctx.beginPath(); ctx.moveTo(X(c), Y(r + .5)); ctx.lineTo(X(c + 1), Y(r + .5)); ctx.stroke(); }));

  /* 위쪽 이름 */
  ctx.textAlign = 'center'; ctx.font = '600 12px sans-serif';
  for(let c = 0; c < N; c++){
    const id = idOfCol[c]; const isMe = id === myId;
    ctx.fillStyle = isMe ? '#cd8407' : '#23251d';
    ctx.font = (isMe ? '800 ' : '600 ') + '12px sans-serif';
    ctx.fillText(id ? short(nm(id)) : String(c + 1), X(c), 22);
  }

  /* 끝난 사람 경로 + 열린 칸 */
  const openEnd = {};
  const polyline = (pts, color, w) => {
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath();
    pts.forEach(([c, r], i) => { const x = X(c), y = Y(r); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
  };
  Object.entries(L.res).forEach(([id, r]) => {
    const p = ladPath(L, L.slots[id]);
    openEnd[p.end] = r;
    if(!L.done || S.phase !== 'result') polyline(p.pts, r === 'hit' ? 'rgba(200,68,47,.75)' : 'rgba(75,138,51,.55)', 4);
  });

  /* 진행 중인 경로 */
  if(S.phase === 'ladder' && L.idx >= 0){
    const id = L.order[L.idx];
    if(!L.res[id]){
      const p = ladPath(L, L.slots[id]);
      const prog = Math.min(1, (now - animT0) / (L.dur || 2500));
      const seg = []; let total = 0;
      for(let i = 1; i < p.pts.length; i++){
        const a = p.pts[i-1], b = p.pts[i];
        const len = Math.hypot(X(b[0]) - X(a[0]), Y(b[1]) - Y(a[1]));
        seg.push(len); total += len;
      }
      let target = prog * total, cur = [p.pts[0]];
      for(let i = 0; i < seg.length; i++){
        const a = p.pts[i], b = p.pts[i+1];
        if(target >= seg[i]){ cur.push(b); target -= seg[i]; }
        else{ const f = seg[i] ? target / seg[i] : 0; cur.push([a[0] + (b[0]-a[0])*f, a[1] + (b[1]-a[1])*f]); break; }
      }
      polyline(cur, '#eb9d2a', 5);
      const head = cur[cur.length - 1];
      ctx.fillStyle = '#cd8407'; ctx.beginPath(); ctx.arc(X(head[0]), Y(head[1]), 7, 0, 7); ctx.fill();
      const sc = $('#lscroll'); const hx = X(head[0]);
      if(sc.scrollWidth > sc.clientWidth) sc.scrollLeft = hx - sc.clientWidth / 2;
    }
  }

  /* 아래쪽 결과 칸 */
  ctx.textAlign = 'center';
  for(let c = 0; c < N; c++){
    const revealed = L.done || openEnd[c] != null;
    const x = X(c), y = Y(rows) + 8;
    const w = Math.min(colW - 6, 40);
    let fill = '#eeefe9', txt = '?', col = '#65675e';
    if(revealed){ if(L.bot[c]){ fill = '#c8442f'; txt = '당첨'; col = '#fff'; } else { fill = '#dcebd3'; txt = '통과'; col = '#2f5a1f'; } }
    ctx.fillStyle = fill; ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x - w/2, y, w, 26, 6); else ctx.rect(x - w/2, y, w, 26);
    ctx.fill();
    ctx.fillStyle = col; ctx.font = '700 12px sans-serif'; ctx.fillText(txt, x, y + 17);
  }
}

/* ============ 이벤트 ============ */
$('#name').value = myName;
$('#code').value = hashCode();
$('#create').addEventListener('click', () => createRoom());
$('#join').addEventListener('click', joinRoom);
$('#code').addEventListener('keydown', e => { if(e.key === 'Enter') joinRoom(); });
$('#leave').addEventListener('click', () => {
  if(isHost && !confirm('방장이 나가면 방이 닫혀요. 나갈까요?')) return;
  leaveRoom(false);
});
$('#share').addEventListener('click', async () => {
  const url = shareUrl();
  try{ await navigator.clipboard.writeText(url); toast('링크를 복사했어요'); }
  catch(e){ prompt('이 링크를 공유하세요', url); }
});
$('#snd').addEventListener('click', () => {
  sound = !sound; store.set('ds_snd', sound ? '1' : '0'); $('#snd').textContent = sound ? '🔊' : '🔇'; beep(660, .1);
});
$('#snd').textContent = sound ? '🔊' : '🔇';
const volIcon = () => { $('#volico').textContent = vol === 0 || !sound ? '🔇' : vol < 35 ? '🔈' : vol < 70 ? '🔉' : '🔊'; };
$('#vol').value = vol; $('#volv').textContent = vol + '%'; volIcon();
let volTest = 0;
$('#vol').addEventListener('input', e => {
  vol = +e.target.value; store.set('ds_vol', String(vol)); $('#volv').textContent = vol + '%'; volIcon();
  if(master) master.gain.value = volGain();
  clearTimeout(volTest); volTest = setTimeout(() => { if(!sound){ sound = true; store.set('ds_snd', '1'); $('#snd').textContent = '🔊'; } ac(); if(master) master.gain.value = volGain(); tone(660, .18, 'triangle', .2); tone(880, .18, 'triangle', .16, .12); volIcon(); }, 120);
});

function submitAnswer(){
  const el = $('#qAns'); const t = el ? el.value.trim() : '';
  if(!t){ toast('답을 입력해 주세요'); return; }
  if(!act({ t:'ans', text:t })) return;
  qMine = t.slice(0, 60); qSent = true; render();
}

/* 스피드 버튼은 손가락이 닿는 순간(pointerdown)에 반응 */
$('#stage').addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sp]'); if(!b || b.disabled) return;
  e.preventDefault(); speedPressLocal();
});
$('#stage').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || b.disabled) return;
  if(b.dataset.sp != null) return;
  keepAwake();
  beep(440, .05);
  if(b.dataset.p != null){ const c = +b.dataset.p; if(act({t:'pick', c})) myPick = c; render(); return; }
  if(b.dataset.c != null){ act({t:'col', c: +b.dataset.c}); return; }
  if(b.dataset.mark != null){ qMark[b.dataset.mark] = !qMark[b.dataset.mark]; render(); return; }
  if(b.dataset.go != null){ setupGame = b.dataset.go; render(); return; }
  if(b.dataset.lm != null){ cfg.lmode = b.dataset.lm; store.set('ds_lmode', cfg.lmode); render(); return; }
  if(b.dataset.mv != null){ const [mid, md] = b.dataset.mv.split('|'); moveLad(mid, +md); return; }
  switch(b.dataset.a){
    case 'rps': startRps(); break;
    case 'ladder': startLadder(); break;
    case 'quiz': startQuiz(); break;
    case 'speed': startSpeed(); break;
    case 'ladderGo': ladderRun(); break;
    case 'ladShuffle': shuffleLad(); break;
    case 'ladStart': startLadHost(); break;
    case 'quizEnd': finishQuiz(); break;
    case 'quizNext': startQuiz(true); break;
    case 'back': setupGame = null; render(); break;
    case 'again': { const g = S.game; toLobby(); setupGame = g; render(); break; }
    case 'ans': submitAnswer(); break;
    case 'lobby': setupGame = null; toLobby(); break;
    case 'close': if(confirm('방을 닫을까요?')) leaveRoom(false); break;
  }
});
$('#stage').addEventListener('input', e => {
  if(e.target.id === 'qText') qText = e.target.value;
  if(e.target.id === 'qAns') qDraft = e.target.value;
});
$('#stage').addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.id === 'qAns'){ e.preventDefault(); submitAnswer(); }
});
$('#stage').addEventListener('change', e => {
  const t = e.target; if(!t.dataset || !t.dataset.cfg) return;
  if(t.dataset.cfg === 'k') cfg.k = +t.value;
  else if(t.dataset.cfg === 'role' && (t.value === 'pay' || t.value === 'free')){ cfg.role = t.value; store.set('ds_role', t.value); }
  else if(t.dataset.cfg === 'qn'){ cfg.qn = Math.max(1, Math.min(10, +t.value || 1)); }
  t.blur(); render();
});
window.addEventListener('pagehide', () => { try{ if(cli && !isHost) pub('a', {t:'off', id:myId}); }catch(e){} });
window.addEventListener('resize', () => { if(S && S.lad && !$('#lwrap').hidden) drawLadder(performance.now()); });
if(typeof mqtt === 'undefined') $('#entryMsg').textContent = '실시간 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.';
</script>
</body>
</html>
