<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>음료 내기</title>
<style>
:root{
  --bg:#e1d7c2; --paper:#fff; --paper2:#eeefe9; --line:#bfc1b7; --line2:#e5e7e0;
  --fg:#23251d; --fg2:#4d4f46; --fg3:#65675e; --amber:#eb9d2a; --amber-dk:#cd8407;
  --red:#c8442f; --green:#4b8a33;
  --ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
[hidden]{display:none!important}
#app{max-width:560px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px}
h2{margin:0 0 8px;font-size:17px}
h3{margin:0 0 2px;font-size:15.5px}
.sub{color:var(--fg3);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:16px}
.code-in{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:700}
.btn{padding:11px 16px;border-radius:6px;border:1px solid var(--line);background:var(--paper);font-weight:600}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--amber);border-color:var(--amber-dk);color:#2a1d00}
.btn:disabled{opacity:.45}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.full{width:100%}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.volrow{flex:1 1 100%;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg2)}
.volrow input[type=range]{flex:1;accent-color:var(--amber-dk);height:28px}
.volrow #volv{min-width:40px;text-align:right}
.head .row{flex-wrap:nowrap;gap:6px}
.head .btn{white-space:nowrap;padding:6px 9px}
.code{font-size:22px;font-weight:800;letter-spacing:.2em}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9ea096;margin-right:5px}
.dot.on{background:var(--green)}
#banner{background:#fff3cd;border:1px solid #e6c866;border-radius:6px;padding:9px 12px;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--paper2);border:1px solid var(--line2);font-size:13.5px}
.chip.me{border-color:var(--amber-dk);font-weight:700}
.chip.off{opacity:.45}
.chip.ok{background:#e2f0da;border-color:#a9cf97}
.chip.lose{background:#fbe0da;border-color:#e3a89d}
.chip.win{background:#e2f0da;border-color:#a9cf97}
.big{font-size:64px;font-weight:800;text-align:center;margin:6px 0;line-height:1.1}
.center{text-align:center}
.rps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.rps button{font-size:44px;padding:18px 0;border:2px solid var(--line);border-radius:12px;background:#fff;line-height:1}
.rps button small{display:block;font-size:13px;margin-top:6px;color:var(--fg2);font-weight:600}
.rps button.sel{border-color:var(--amber-dk);background:#fff3da;box-shadow:0 0 0 3px rgba(235,157,42,.35)}
.rev{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.rev .chip{font-size:15px;padding:6px 12px}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:10px 0}
.cols button{padding:10px 4px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:700;font-size:15px}
.cols button small{display:block;font-weight:500;color:var(--fg3);font-size:11px;min-height:15px}
.cols button.taken{background:var(--paper2);color:var(--fg3)}
.cols button.mine{border-color:var(--amber-dk);background:#fff3da}
#lscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
canvas{display:block}
.tally{font-size:13px;color:var(--fg2);margin-top:8px}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;border:1px solid rgba(0,0,0,.35);vertical-align:-1px;margin-right:4px}
.cols button .sw{display:block;width:22px;height:22px;margin:0 auto 4px}
#rcv{display:block;width:100%;height:440px;border-radius:8px;background:#5b5d56}
.vlist{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.vrow{display:flex;align-items:center;gap:8px;padding:5px 10px;min-height:30px;border:1px solid var(--line2);border-radius:8px;background:#fff;font-size:14px}
.vrow b{min-width:24px}
.vrow .cn{font-weight:600}
.vrow .on{margin-left:auto;color:var(--fg2)}
.vrow .badge{margin-left:0}
.vrow.hid{border:2px dashed var(--line);background:var(--paper2);color:var(--fg3)}
.vrow.w{background:#fbe0da;border-color:#e3a89d}
.vrow.new{border-color:var(--amber-dk);box-shadow:0 0 0 3px rgba(235,157,42,.3)}
.vrow.me{font-weight:700}
.win-name{font-size:26px;font-weight:800;color:var(--red);text-align:center;margin:8px 0;line-height:1.3}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:#23251d;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9}
#toast.show{opacity:.95}
select{padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff;flex:1;min-width:0}
/* 메인(게임 선택) / 게임 설정 */
.games4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gbtn{padding:30px 8px;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:8px;line-height:1.3;border-radius:12px}
.gbtn .gi{font-size:40px;line-height:1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.seg button{padding:12px 6px;border:2px solid var(--line);border-radius:10px;background:#fff;font-weight:600;font-size:14px;line-height:1.3}
.seg button small{display:block;font-weight:500;color:var(--fg3);font-size:11.5px;margin-top:3px}
.seg button.on{border-color:var(--amber-dk);background:#fff3da;box-shadow:0 0 0 3px rgba(235,157,42,.3)}
.setup-sec{margin-top:14px}
.rulebar{background:#fff8e8;border:1px solid #f0d9a8;border-radius:12px;padding:10px 12px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.games .wide{grid-column:1 / -1}
/* 퀴즈 */
.qbox{background:#fff3da;border:1px solid var(--amber-dk);border-radius:8px;padding:12px;font-size:18px;font-weight:700;margin:6px 0 10px;word-break:break-word}
.arow{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid var(--line2)}
.arow.ok{background:#e9f4e2}
.arow b{min-width:22px;color:var(--fg3)}
.arow .who{font-weight:700;white-space:nowrap}
.arow .atx{flex:1;word-break:break-word}
.arow button{padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.arow.ok button{background:var(--green);border-color:var(--green);color:#fff}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--amber);color:#2a1d00;font-size:11px;font-weight:700;margin-left:4px}
/* 스피드 */
.spbtn{width:100%;padding:36px 0;font-size:32px;font-weight:800;border-radius:16px;border:3px solid var(--line);background:#e6e6df;color:var(--fg3);margin:8px 0;user-select:none;-webkit-user-select:none}
.spbtn.go{background:var(--red);color:#fff;border-color:#8f2c1b}
.spbtn:disabled{opacity:.7}
.rrow{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px}
.rrow.w{background:#e9f4e2;font-weight:700}
.rrow b{min-width:22px}
.rrow span:last-child{margin-left:auto;color:var(--fg2)}

/* 익명투표함 */
.games4 .gbtn.gwide{grid-column:1 / -1;flex-direction:row;justify-content:center;padding:20px 8px;gap:12px}
.games4 .gbtn.gwide .gi{font-size:30px}
.vopts{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.vopt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:14px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:17px;font-weight:600;text-align:left;word-break:break-word}
.vopt .vdot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--fg3);box-sizing:border-box}
.vopt.sel{border-color:var(--amber-dk);background:#fff3da;box-shadow:0 0 0 3px rgba(235,157,42,.35);font-weight:700}
.vopt.sel .vdot{border-color:var(--amber-dk);background:radial-gradient(circle,var(--amber-dk) 40%,transparent 45%)}
.vcheck{width:64px;height:64px;border-radius:50%;background:#e2f0da;border:2px solid var(--green);color:#2f5a1f;font-size:34px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto}
.vbar{height:10px;border-radius:999px;background:var(--paper2);border:1px solid var(--line2);overflow:hidden;margin-top:4px}
.vbar i{display:block;height:100%;background:var(--amber)}
.vlock{border:1px dashed var(--line);border-radius:8px;padding:12px;margin-top:12px}
.vl{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}
.vl span{width:64px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vl i{flex:1;height:18px;border-radius:4px;background:repeating-linear-gradient(45deg,var(--paper2),var(--paper2) 6px,var(--line2) 6px,var(--line2) 12px)}
.vl em{width:20px;text-align:right;font-style:normal;color:var(--fg3)}
.vres{margin:10px 0}
.vrow{display:flex;justify-content:space-between;gap:8px}
.vtrack{height:22px;border-radius:4px;background:var(--paper2);overflow:hidden}
.vfill{height:100%;background:var(--line)}
.vfill.top{background:var(--amber)}
@media (min-width:900px){ .vopt{font-size:20px;padding:20px} .games4 .gbtn.gwide{padding:30px 10px} .vl{font-size:16px} }

/* ===== PC 미리보기: 넓은 화면에서 2단 배치 ===== */
@media (min-width:900px){
  body{font-size:16px}
  #app{max-width:1240px;padding:28px 32px 40px}
  #entry{max-width:520px;margin:8vh auto 0;padding:30px}
  #room:not([hidden]){display:grid!important;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"banner banner" "stage head" "stage plist" "lwrap plist";gap:16px;align-items:start}
  #banner{grid-area:banner} .card.head{grid-area:head} #stage{grid-area:stage;min-height:600px;padding:30px 36px} #lwrap{grid-area:lwrap} #plist{grid-area:plist}
  .code{font-size:30px}
  h2{font-size:23px;margin-bottom:12px}
  .sub{font-size:14px}
  .chip{font-size:15px;padding:5px 12px}
  #plist .chips{gap:8px}
  .btn{padding:14px 20px;font-size:16px}
  .btn.sm{padding:8px 12px;font-size:14px}
  .head .btn{padding:8px 12px}
  .games{grid-template-columns:repeat(3,1fr);gap:12px}
  .games .wide{grid-column:auto}
  .games .btn{padding:26px 10px;font-size:18px}
  .games4{grid-template-columns:repeat(4,1fr);gap:16px}
  .gbtn{padding:64px 10px;font-size:22px}
  .gbtn .gi{font-size:60px}
  .seg button{padding:18px 8px;font-size:16px}
  .seg button small{font-size:13px}
  #stage select{max-width:300px;padding:12px;font-size:16px}
  #stage input[type=text]{padding:14px 16px;font-size:17px}
  .big{font-size:140px;margin:18px 0}
  .rps{gap:20px;margin:22px auto;max-width:720px}
  .rps button{font-size:80px;padding:44px 0;border-radius:18px}
  .rps button small{font-size:16px;margin-top:10px}
  .rev .chip{font-size:20px;padding:10px 18px}
  .qbox{font-size:26px;padding:22px 24px}
  .arow{padding:12px 10px;font-size:17px}
  .arow button{padding:8px 16px;font-size:15px}
  .win-name{font-size:40px;margin:18px 0}
  .spbtn{padding:70px 0;font-size:44px;max-width:720px;margin:18px auto;display:block}
  .cols{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px}
  .cols button{padding:16px 4px;font-size:18px}
  .rrow{font-size:17px;padding:9px 12px}
  canvas{margin:0 auto}
}

@media (min-width:900px){
  #stage{min-height:0;padding:36px 44px}
  #app{max-width:1280px}
  #room:not([hidden]){grid-template-columns:minmax(0,1fr) 360px}
  .games{gap:16px}
  .games .btn{padding:58px 10px;font-size:23px;border-radius:12px}
  #stage select{max-width:none;flex:1;padding:14px;font-size:17px}
  #stage input[type=text]{padding:18px 18px;font-size:18px}
  #stage .row .btn{padding:18px 26px;font-size:18px}
  #plist{padding:20px}
  #plist .chip{font-size:17px;padding:8px 16px}
  .card.head{padding:20px}
  .code{font-size:34px}
  .tally{font-size:15px}
  .ladhead{display:none}
  .arow{font-size:18px;padding:14px 12px}
  .qbox{font-size:30px}
  #lwrap{padding:20px}
}

@media (min-width:900px){
  .card.head{flex-wrap:wrap;row-gap:12px}
  .head .row{flex-wrap:wrap}
  .games .btn{font-size:21px;word-break:keep-all}
  #room[data-phase]:not([data-phase="ladder"]):not([data-phase="lpick"]) #stage{min-height:calc(100vh - 72px);display:flex;flex-direction:column;justify-content:center}
  #plist{position:sticky;top:16px}
}

@media (min-width:900px){
  #stage > .rps{width:100%}
  #stage > .btn.sm{align-self:flex-start}
  #stage > .spbtn{width:100%}
  #stage > .qbox{width:100%}
}
</style>
</head>
<body>
<div id="app">

  <!-- 입장 화면 -->
  <section id="entry" class="card">
    <h2>☕ 음료 내기</h2>
    <p class="sub" style="margin:0 0 12px">가위바위보 · 사다리타기 · 퀴즈 · 5초 만들기 · 익명투표 · 자동차 레이스를 모두가 각자 폰으로 참여해요. (2~30명, 별도 가입 없음)</p>
    <label class="sub">내 이름</label>
    <input type="text" id="name" maxlength="8" placeholder="이름(8자 이내)" autocomplete="off">
    <div style="height:12px"></div>
    <button class="btn pri full" id="create" type="button">방 만들기 (방장)</button>
    <div class="sub center" style="margin:12px 0 6px">또는 방 코드로 참여</div>
    <div class="row" style="flex-wrap:nowrap">
      <input type="text" id="code" class="code-in" maxlength="4" placeholder="CODE" autocomplete="off">
      <button class="btn" id="join" type="button" style="white-space:nowrap">참여</button>
    </div>
    <p class="sub" id="entryMsg" style="margin:10px 0 0;color:var(--red)"></p>
  </section>

  <!-- 방 화면 -->
  <section id="room" hidden style="display:flex;flex-direction:column;gap:12px">
    <div id="banner" hidden></div>
    <div class="card head">
      <div>
        <div class="code" id="rcode"></div>
        <div class="sub"><span class="dot" id="cdot"></span><span id="rcnt"></span></div>
      </div>
      <div class="row">
        <button class="btn sm" id="snd" type="button" aria-label="소리">🔊</button>
        <button class="btn sm" id="share" type="button">링크 복사</button>
        <button class="btn sm" id="leave" type="button">나가기</button>
      </div>
      <div class="volrow"><span id="volico">🔊</span><input type="range" id="vol" min="0" max="100" step="1" aria-label="볼륨"><span id="volv"></span></div>
    </div>
    <div class="card" id="stage"></div>
    <div class="card" id="lwrap" hidden><div id="lscroll"><canvas id="cv"></canvas></div></div>
    <div class="card" id="plist"></div>
  </section>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
/* ============ 설정 ============ */
const MAX = 30, MIN = 2, MAXK = 20;
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const NS = 'bdts-ts1-drink-v1/';
const SHAPES = ['✌️', '✊', '✋'], SHAPE_NAME = ['가위', '바위', '보'];
const RPS_SECS = 5;           /* 가위바위보 선택 제한 시간(초) */
const PICK_SECS = 10;         /* 사다리 번호 선택 · 퀴즈 답변 제한 시간(초) */
const SP_TARGET = 5;          /* 5초 만들기: 맞춰야 하는 목표 시간(초) */
const SP_LEAD = 3;            /* 5초 만들기: 시작 전 준비 카운트다운(초) */
const SP_SHOW = 2;            /* 5초 만들기: 스톱워치 숫자가 보이는 시간(초) — 이후엔 '?'로 가려짐 */
const SP_LIMIT = 10;          /* 5초 만들기: 시작 후 이 시간(초)까지 안 누르면 기록 없음 */
const VMIN = 2, VMAX = 6;     /* 익명투표: 선택지 개수 */
const VOTE_SECS = 60;         /* 익명투표: '시간 제한' 모드의 제한 시간(초) */
const VOTE_WAIT = 2200;       /* 익명투표: 마감 후 늦게 도착하는 표를 기다리는 시간(ms) */
const GAME_NAME = { rps:'가위바위보', ladder:'사다리타기', quiz:'퀴즈', speed:'5초 만들기', vote:'익명투표', race:'자동차 레이스' };
const RACE_CD = 3;            /* 자동차 레이스: 출발 카운트다운(초) */
/* 자동차 30종 (성능 차이는 없고 색·이름·번호만 달라요) */
const CARS = [
  ['로드스터','#d94a3a'],['지프','#f08a24'],['택시','#f2c230'],['해치백','#7fb83a'],['쿠페','#2f8f5b'],['밴','#3cb7a8'],
  ['세단','#4aa3e0'],['스포츠','#2d5fc4'],['리무진','#7e57c2'],['미니','#e66a9e'],['클래식','#8a8d85'],['슈퍼카','#2b2c28'],
  ['트럭','#a0522d'],['버스','#e8c07a'],['왜건','#5f7a3a'],['컨버터블','#ff5d8f'],['픽업','#b9852b'],['레트로','#c9a0dc'],
  ['경주차','#b3121f'],['구급차','#f4f4f0'],['소방차','#ff3b1d'],['경찰차','#1d3d7a'],['캠핑카','#8fd3c8'],['카트','#ffa8a8'],
  ['오픈카','#00a6a6'],['포뮬러','#6a1b9a'],['랠리카','#ff7f00'],['SUV','#556b2f'],['전기차','#36d1a0'],['트랙터','#9c6b30']
];
const raceDur = n => n <= 5 ? 10 : n <= 15 ? 20 : n < 20 ? 20 + 5 * (n - 15) : 45;   /* 레이스 길이(초): 5명 이하 10초, 6~15명 20초, 16~19명은 1명당 +5초, 20명 이상 45초 */

const $ = s => document.querySelector(s);

/* ============ 소리 / 진동 ============ */
let actx = null, noiseBuf = null, master = null, rvIn = null;
function ac(){
  try{
    if(!actx){
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = volGain();
      const comp = actx.createDynamicsCompressor();
      comp.threshold.value = -10; comp.knee.value = 8; comp.ratio.value = 12; comp.attack.value = 0.003; comp.release.value = 0.15;
      master.connect(comp); comp.connect(actx.destination);
      /* 짧은 잔향(리버브): 소리가 밋밋하지 않고 공간감 있게 */
      const len = Math.floor(actx.sampleRate * 1.5), ib = actx.createBuffer(2, len, actx.sampleRate);
      for(let c = 0; c < 2; c++){ const d = ib.getChannelData(c); for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
      const conv = actx.createConvolver(); conv.buffer = ib;
      const wet = actx.createGain(); wet.gain.value = 0.3;
      rvIn = actx.createGain(); rvIn.connect(conv); conv.connect(wet); wet.connect(master);
    }
    if(actx.state === 'suspended') actx.resume();
    return actx;
  }catch(e){ return null; }
}
/* 음 하나: at 초 뒤에 시작, slideTo가 있으면 그 음높이로 미끄러짐. 부드러운 시작음 + (톱니/사각파는) 살짝 어긋난 두 번째 소리로 두툼하게 + 잔향 */
function tone(freq, dur, type, vol, at, slideTo){
  if(!sound) return;
  const a = ac(); if(!a) return;
  try{
    const t = a.currentTime + (at || 0), v = vol || 0.15, ty = type || 'sine';
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + Math.min(0.012, dur / 4));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(master || a.destination);
    if(rvIn){ const w = a.createGain(); w.gain.value = dur > 0.2 ? 0.35 : 0.12; g.connect(w); w.connect(rvIn); }
    const mk = det => {
      const o = a.createOscillator(); o.type = ty;
      o.frequency.setValueAtTime(freq, t);
      if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      if(det) o.detune.value = det;
      o.connect(g); o.start(t); o.stop(t + dur + 0.03);
    };
    mk(0);
    if(ty === 'sawtooth' || ty === 'square') mk(9);
  }catch(e){}
}
const beep = (freq, dur, type, vol) => tone(freq, dur, type, vol, 0);
/* 잡음(북 스틱·심벌 느낌) */
function noise(dur, vol, at, hp, lp){
  if(!sound) return;
  const a = ac(); if(!a) return;
  try{
    if(!noiseBuf){
      noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
      const d = noiseBuf.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = a.currentTime + (at || 0);
    const src = a.createBufferSource(); src.buffer = noiseBuf;
    const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 1200;
    const g = a.createGain();
    g.gain.setValueAtTime(vol || 0.1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let last = f;
    if(lp){ const l = a.createBiquadFilter(); l.type = 'lowpass'; l.frequency.value = lp; f.connect(l); last = l; }
    src.connect(f); last.connect(g); g.connect(master || a.destination);
    if(rvIn && dur > 0.2){ const w = a.createGain(); w.gain.value = 0.25; g.connect(w); w.connect(rvIn); }
    src.start(t); src.stop(t + dur + 0.03);
  }catch(e){}
}
/* 드럼롤: 점점 빨라지고 커짐 */
function drumRoll(ms, vol){
  const v = vol || 0.3; let t = 0, i = 0;
  while(t < ms){
    const p = t / ms;
    noise(0.07, v * (0.35 + 0.65 * p), t / 1000, 700);
    if(i % 2 === 0) tone(95 + 40 * p, 0.09, 'sine', v * 0.9, t / 1000, 60);
    t += 125 - 90 * p; i++;
  }
  noise(0.5, v * 1.1, ms / 1000, 2500);   /* 마지막 심벌 */
}

function cheer(dur, vol, at){ for(let i = 0; i < 3; i++) noise(dur * (0.6 + 0.2 * i), (vol || 0.15) * (1 - i * 0.15), (at || 0) + i * 0.08, 500, 3200 + i * 900); }

/* 레이스 엔진음: 계속 울리다가 진행도에 따라 높아짐 */
let eng = null;
function engineStart(){
  if(!sound || eng) return;
  const a = ac(); if(!a) return;
  try{
    const o = a.createOscillator(), o2 = a.createOscillator(), lfo = a.createOscillator(), lg = a.createGain(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = 'sawtooth'; o2.type = 'square'; o.frequency.value = 62; o2.frequency.value = 31;
    f.type = 'lowpass'; f.frequency.value = 380; f.Q.value = 4;
    g.gain.value = 0.0001; lfo.frequency.value = 16; lg.gain.value = 0.012;
    lfo.connect(lg); lg.connect(g.gain);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(master || a.destination);
    o.start(); o2.start(); lfo.start();
    g.gain.linearRampToValueAtTime(0.045, a.currentTime + 0.6);
    eng = { o, o2, lfo, f, g };
  }catch(e){ eng = null; }
}
function engineSet(p, boost){
  if(!eng) return;
  if(!sound){ engineStop(); return; }
  try{
    const t = actx.currentTime, k = Math.max(0, Math.min(1, p)) + (boost ? 0.25 : 0);
    eng.o.frequency.setTargetAtTime(62 + 120 * k, t, 0.12); eng.o2.frequency.setTargetAtTime(31 + 60 * k, t, 0.12);
    eng.f.frequency.setTargetAtTime(380 + 1000 * k, t, 0.12);
  }catch(e){}
}
function engineStop(){
  if(!eng) return;
  const e = eng; eng = null;
  try{ e.g.gain.cancelScheduledValues(0); e.g.gain.setTargetAtTime(0.0001, actx.currentTime, 0.15); }catch(x){}
  setTimeout(() => { try{ e.o.stop(); e.o2.stop(); e.lfo.stop(); }catch(x){} }, 700);
}

function pub(sub, obj, opt){

/* 화면 꺼짐 방지: 특히 방장 폰이 잠기면 모든 사람의 게임이 멈춤 */
let wakeLock = null;
async function keepAwake(){
  try{
    if(!room || wakeLock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  }catch(e){ wakeLock = null; }
}
function releaseAwake(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null; }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') keepAwake(); });

function startConn(){
  if(cli){ try{ cli.end(true); }catch(e){} cli = null; }
  connected = false; joinedAt = Date.now(); lastHb = 0;
  connect();
}
function connect(){
  const url = BROKERS[brokerIdx % BROKERS.length];
  let ever = false, fails = 0;
  const c = mqtt.connect(url, {
    clientId: 'ds_' + Math.random().toString(36).slice(2,10),
    clean: true, keepalive: 30, connectTimeout: 7000, reconnectPeriod: 2500,
    will: { topic: NS + room + '/a', payload: JSON.stringify({t:'off', id:myId}), qos: 0 }
  });
  cli = c;
  c.on('connect', () => {
    ever = true; fails = 0; connected = true; setConn(true);
    const subs = [NS+room+'/s', NS+room+'/hb'];
    if(isHost) subs.push(NS+room+'/a', NS+room+'/v');
    c.subscribe(subs);
    onConnected();
  });
  c.on('close', () => {
    connected = false; setConn(false);
    if(!ever && ++fails >= 2 && cli === c){ c.end(true); brokerIdx++; connect(); }
  });
  c.on('error', () => {});
  c.on('message', onMsg);
}
function onConnected(){
  if(isHost){
    if(published){ push(); }
    else{
      setTimeout(() => {
        if(!isHost || published) return;
        if(collision){ createRoom(true); return; }
        published = true; push(); startHb();
      }, 1100);
    }
  }else{
    sendJoin();
  }
}
function startHb(){
  clearInterval(hbTimer);
  hbTimer = setInterval(() => pub('hb', {t:Date.now()}), 4000);
  pub('hb', {t:Date.now()});
}
function onMsg(topic, buf){
  const pre = NS + room + '/';
  if(!topic.startsWith(pre)) return;
  const sub = topic.slice(pre.length), txt = buf.toString();
  if(sub === 's'){
    if(!txt){ if(!isHost) closedByHost(); return; }
    let m; try{ m = JSON.parse(txt); }catch(e){ return; }
    onState(m);
  }else if(sub === 'hb'){
    lastHb = Date.now();
  }else if(sub === 'a' && isHost){
    let m; try{ m = JSON.parse(txt); }catch(e){ return; }
    handleAction(m);
  }else if(sub === 'v' && isHost){
    let m; try{ m = JSON.parse(txt); }catch(e){ return; }
    if(m && Number.isInteger(m.c)) voteCount(m.c);      /* 선택만 도착: 보낸 사람 정보 없음 */
  }
}
function sendJoin(){ lastJoinSent = Date.now(); pub('a', {t:'join', id:myId, name:myName}); }

function onState(m){
  if(isHost){ if(!published && m.host !== myId) collision = true; return; }
  if(m.host === myId){ becomeHost(m); return; }
  S = m;
  if(!S.players.some(p => p.id === myId) && onlineCnt() < MAX && Date.now() - lastJoinSent > 2000) sendJoin();
  render();
}
function becomeHost(m){
  isHost = true; published = true; S = m;
  if(S.phase !== 'lobby'){ resetToLobby(); }
  const p = S.players.find(x => x.id === myId); if(p){ p.on = true; p.name = myName || p.name; }
  cli.subscribe([NS + room + '/a', NS + room + '/v']);
  startHb(); push(); toast('방장으로 다시 연결됐어요');
}
function closedByHost(){

  $('#entryMsg').textContent = '방이 닫혔어요.';

/* ============ 방장: 상태 반영 ============ */
function push(){

  S.v++;
  pub('s', S, {qos:0, retain:true});
  render();
}
const pl = id => S.players.find(p => p.id === id);
const nm = id => { const p = pl(id); return p ? p.name : '?'; };
function uniqueName(n, selfId){
  let base = n, k = 2, cur = n;
  while(S.players.some(p => p.name === cur && p.id !== selfId)) cur = base + k++;
  return cur;
}
/* 정원이 찼을 때: 이미 나간(오프라인) 사람 중 진행 중인 게임에 끼어 있지 않은 사람의 자리를 비워 줌 */
function evictOffline(){
  const busy = new Set([].concat(S.alive || [], S.rpool || [], (S.lad && S.lad.ids) || [], S.qids || [], (S.sp && S.sp.ids) || [], (S.vote && S.vote.ids) || [], (S.race && S.race.ids) || []));
  const i = S.players.findIndex(p => !p.on && !p.bot && p.id !== S.host && !busy.has(p.id));
  if(i < 0) return false;
  S.players.splice(i, 1);
  return true;
}

function handleAction(m){
  if(!isHost || !S || !m || !m.id) return;
  const id = m.id;
  switch(m.t){
    case 'join': {
      const p = pl(id);
      if(p){ p.on = true; if(m.name && m.name !== p.name) p.name = uniqueName(String(m.name).slice(0,8), id); }
      else{
        if(S.players.length >= MAX && !evictOffline()) return;
        S.players.push({ id, name: uniqueName(String(m.name||'?').slice(0,8)), on:true });
      }
      push(); break;
    }
    case 'off': {
      const p = pl(id);
      if(p){ p.on = false; push(); if(S.phase==='rps') checkRpsAll(); if(S.phase==='lpick') checkLadderAll(); if(S.phase==='speed') checkSpeedAll(); if(S.phase==='vote') checkVoteAll(); if(S.phase==='rpick') checkRaceAll(); }
      break;
    }
    case 'pick': rpsPick(id, m.c); break;
    case 'col': ladderCol(id, m.c); break;
    case 'ans': quizAnswer(id, m.text); break;
    case 'sp': speedPress(id, m.rt); break;
    case 'car': raceCar(id, m.c); break;
    case 'vreg': voteReg(id); break;       /* '투표했다'는 사실만 등록 (선택 내용은 별도 경로로 옴) */
  }
}

function resetToLobby(){

/* ----- 연습 모드: 사람이 방장 1명뿐이면 '연습봇'이 함께 참여 ----- */

}
function dropBots(){ S.players = S.players.filter(p => !p.bot); }
const botWait = (fn, ms) => setTimeout(() => { try{ fn(); }catch(e){} }, ms);
function botRps(){ if(pl(BOT) && S.alive.includes(BOT)) botWait(() => rpsPick(BOT, Math.floor(Math.random()*3)), 700 + Math.random()*2200); }

/* 게임 종료 공통: winners=당첨자, pool=참여자. role에 따라 쏘는 사람(payers)이 정해짐 */
function finishGame(game, winners, pool, extra){
  const role = S.rule ? S.rule.role : 'pay';
  const none = winners.length === 0;
  const payers = none ? [] : (role === 'pay' ? winners.slice() : pool.filter(id => !winners.includes(id)));
  S.phase = 'result';
  S.result = Object.assign({ game, winners, pool, payers, role, void: none }, extra || {});
  payers.forEach(id => { S.buys[id] = (S.buys[id] || 0) + 1; });
  push();
}

/* ----- 가위바위보: 당첨(=진 사람) k명을 가릴 때까지 ----- */
function startRps(){
  ensureBot();
  const ps = S.players.filter(p => p.on);
  if(ps.length < MIN){ toast('최소 2명이 필요해요'); return; }
  const ids = ps.map(p => p.id);
  S.rule = ruleFor('rps', ids.length);
  S.game = 'rps'; S.alive = ids.slice(); S.rpool = ids.slice(); S.conf = []; S.need = S.rule.k;
  S.round = 1; S.result = null; S.note = '';
  nextRpsRound();
}
function nextRpsRound(){
  picks = {}; S.rk++; S.picked = []; S.reveal = null; S.phase = 'rps'; S.secs = RPS_SECS;
  clearTimeout(rpsTimer); rpsTimer = setTimeout(resolveRps, RPS_SECS * 1000 + 1200);
  push(); botRps();
}
function rpsPick(id, c){
  if(S.phase !== 'rps' || !S.alive.includes(id) || ![0,1,2].includes(c)) return;
  picks[id] = c;
  S.picked = Object.keys(picks); push();
  checkRpsAll();
}
function checkRpsAll(){
  if(S.phase !== 'rps') return;
  const need = S.alive.filter(id => pl(id) && pl(id).on);
  if(need.every(id => picks[id] != null)) setTimeout(() => { if(S.phase === 'rps') resolveRps(); }, 500);
}
function resolveRps(){
  if(S.phase !== 'rps') return;
  clearTimeout(rpsTimer);
  const alive = S.alive;
  alive.forEach(id => { if(picks[id] == null) picks[id] = rnd(3); });
  S.phase = 'count'; S.picked = alive.slice(); push();
  setTimeout(() => {
    const ch = Object.assign({}, picks);
    const sh = [...new Set(alive.map(id => ch[id]))];
    let out = 'draw', losers = [], safe = [], pair = null;
    if(sh.length === 3 && alive.length >= 5){
      /* 인원이 많으면 3가지 모양이 거의 항상 나와 승부가 안 남 → 두 모양만 무작위로 대결 */
      const skip = rnd(3);
      pair = sh.filter(s => s !== skip).sort();
      const [x, y] = pair;
      const w = ((x - y + 3) % 3 === 1) ? x : y;
      const lsh = (w === x) ? y : x;
      losers = alive.filter(id => ch[id] === lsh);
    }else if(sh.length === 2){
      const [x, y] = sh;
      const w = ((x - y + 3) % 3 === 1) ? x : y;
      losers = alive.filter(id => ch[id] !== w);
    }
    if(losers.length){
      safe = alive.filter(id => !losers.includes(id));
      if(losers.length === S.need) out = 'final';       /* 정확히 필요한 인원 */
      else if(losers.length < S.need) out = 'part';     /* 진 사람은 확정, 이긴 사람들끼리 나머지 가림 */
      else out = 'next';                                /* 너무 많이 짐 → 진 사람들끼리 다시 */
    }
    S.phase = 'reveal'; S.reveal = { choices: ch, out, losers, safe, pair, need: S.need }; push();
    setTimeout(() => {
      if(out === 'draw'){ S.note = '비겼어요! 같은 멤버로 다시'; nextRpsRound(); }
      else if(out === 'final'){ finishGame('rps', S.conf.concat(losers), S.rpool, {}); }
      else if(out === 'part'){
        S.conf = S.conf.concat(losers); S.need -= losers.length; S.alive = safe; S.round++;
        S.note = `${losers.length}명 확정! 남은 ${S.need}명을 더 가려요`; nextRpsRound();
      }else{
        S.alive = losers; S.round++; S.note = `진 ${losers.length}명끼리 계속!`; nextRpsRound();
      }
    }, 5200);
  }, 3300);
}

/* ===== 레이스 시뮬레이션 (모든 기기에서 같은 seed → 같은 결과. Math.random/초월함수 사용 금지) ===== */
const RACE_L = 1000, RACE_DT = 0.05, RACE_V = 50;
function mkRng(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function raceSim(seed, N){
  const rnd = mkRng(seed), L = RACE_L, dt = RACE_DT, est = L / RACE_V;
  const pos = new Float64Array(N), m = new Float64Array(N), bst = new Float64Array(N), spn = new Float64Array(N);
  const fin = new Float64Array(N).fill(-1);
  /* 이벤트 일정(시작 시각만 미리 뽑고, 대상 차량은 그 시점의 순위로 정함) */
  const evs = [];
  const K = 3 + Math.floor(N / 5);
  let scDone = false;
  for(let k = 0; k < K; k++){
    const u = rnd(), r = rnd();
    let type = r < 0.5 ? 'boost' : 'spin';
    let t = est * (0.12 + 0.85 * Math.sqrt(u));
    if(!scDone && r > 0.86){ type = 'sc'; scDone = true; t = est * (0.4 + 0.3 * u); }
    evs.push({ t0: t, type, car: -1, t1: 0, done: false });
  }
  evs.sort((a, b) => a.t0 - b.t0);
  const traj = [];
  const snap = () => { for(let i = 0; i < N; i++) traj.push(pos[i]); };
  snap();
  let t = 0, step = 0, left = N, scUntil = -1;
  const idx = new Array(N);
  while(left > 0 && step < 4000){
    step++; t = step * dt;
    /* 현재 순위(앞선 순) */
    for(let i = 0; i < N; i++) idx[i] = i;
    idx.sort((a, b) => (fin[a] >= 0 ? 1e9 - fin[a] : pos[a]) - (fin[b] >= 0 ? 1e9 - fin[b] : pos[b]) || a - b);
    idx.reverse();
    const run = idx.filter(i => fin[i] < 0);
    /* 이벤트 발동 */
    for(const e of evs){
      if(e.done || t < e.t0) continue;
      e.done = true;
      if(e.type === 'sc'){ e.t1 = t + 1.6; scUntil = e.t1; continue; }
      if(!run.length) continue;
      const nn = run.length;
      let pick;
      if(e.type === 'boost') pick = run[Math.floor(nn * 0.4 + rnd() * nn * 0.6)];      /* 뒤쪽 60% */
      else pick = run[Math.floor(rnd() * Math.max(1, Math.ceil(nn * 0.4)))];             /* 앞쪽 40% */
      if(pick === undefined) pick = run[0];
      e.car = pick;
      if(e.type === 'boost'){ bst[pick] = 1.3; e.t1 = t + 1.3; } else { spn[pick] = 1.0; e.t1 = t + 1.0; }
    }
    const lead = run.length ? pos[run[0]] : L;
    const prog = lead / L;
    const sigma = prog > 0.78 ? 0.26 : 0.18;
    const sc = t < scUntil;
    let mean = 0; for(let q = 0; q < run.length; q++) mean += pos[run[q]]; mean = run.length ? mean / run.length : 0;
    const second = run.length > 1 ? pos[run[1]] : -1e9;
    for(let q = 0; q < run.length; q++){
      const i = run[q];
      m[i] += -1.0 * m[i] * dt + sigma * (rnd() * 2 - 1) * 1.732 * 0.2236;   /* sqrt(dt)=0.2236 */
      let v = RACE_V * (1 + m[i]);
      if(q > 0){                                  /* 슬립스트림: 바로 앞차가 가까우면 가속 */
        const gap = pos[run[q - 1]] - pos[i];
        if(gap < 18) v *= 1.05;
      }
      const behind = lead - pos[i];               /* 러버밴드 */
      if(behind > 80) v *= 1 + Math.min(0.08, (behind - 80) * 0.0006);
      if(q === 0 && pos[i] - second > 40) v *= 0.96;      /* 선두 독주 방지 */
      if(bst[i] > 0){ v *= 1.3; bst[i] -= dt; }
      if(spn[i] > 0){ v *= 0.35; spn[i] -= dt; }
      if(sc) v *= 0.6;
      if(v < 5) v = 5;
      let np = pos[i] + v * dt;
      if(sc) np += (mean - np) * 0.03;
      if(np >= L){
        fin[i] = t - (np - L) / v;
        pos[i] = L; left--;
      }else pos[i] = np;
    }
    snap();
  }
  for(let i = 0; i < N; i++) if(fin[i] < 0){ fin[i] = t + (L - pos[i]) / RACE_V; }
  const order = []; for(let i = 0; i < N; i++) order.push(i);
  order.sort((a, b) => fin[a] - fin[b] || a - b);
  return { N, dt, steps: step + 1, pos: traj, fin: Array.from(fin), order, tFirst: fin[order[0]], tEnd: fin[order[N - 1]], events: evs.filter(e => e.done).map(e => ({ t0: e.t0, t1: e.t1, type: e.type, car: e.car })) };
}

/* ----- 자동차 레이스 ----- */
/* 결과(시드)만 방장이 정해서 알려 주고, 각 기기가 같은 시뮬레이션을 돌려 같은 화면을 보여줘요. 당첨은 꼴찌부터 k명. */
function startRace(){
  ensureBot();
  const ps = S.players.filter(p => p.on);
  if(ps.length < MIN){ toast('최소 2명이 필요해요'); return; }
  const ids = ps.map(p => p.id), N = ids.length;
  S.rule = ruleFor('race', N);
  let wr;
  if(cfg.rmode === 'pick'){
    wr = [...new Set(cfg.rk)].filter(r => r >= 1 && r <= N).sort((a, b) => a - b);
    if(!wr.length || wr.length >= N){ toast(wr.length ? '당첨 순위는 전체 인원보다 적어야 해요' : '당첨 순위를 1개 이상 골라 주세요'); return; }
    S.rule = { k: wr.length, role: S.rule.role };
  }else wr = [...Array(S.rule.k).keys()].map(i => N - i).sort((a, b) => a - b);
  S.game = 'race'; S.result = null; S.phase = 'rpick'; S.secs = PICK_SECS;
  S.race = { N, ids, slots: {}, k: wr.length, wr };
  S.rk++; clearTimeout(raceTimer);
  raceTimer = setTimeout(() => { if(S.phase === 'rpick') raceRun(); }, PICK_SECS * 1000 + 1200);   /* 시간 안에 못 고른 사람은 랜덤 배정 */
  push(); botRace();
}
function botRace(){
  if(!pl(BOT)) return;
  botWait(() => {
    if(S.phase !== 'rpick') return;
    const used = Object.values(S.race.slots), free = [...Array(S.race.N).keys()].filter(c => !used.includes(c));
    if(free.length) raceCar(BOT, free[Math.floor(Math.random() * free.length)]);
  }, 1000 + Math.random() * 2500);
}
function raceCar(id, c){
  if(S.phase !== 'rpick' || !S.race.ids.includes(id)) return;
  const R = S.race;
  if(!Number.isInteger(c) || c < 0 || c >= R.N) return;
  if(Object.entries(R.slots).some(([i, v]) => v === c && i !== id)) return;
  R.slots[id] = c; push(); checkRaceAll();
}
function checkRaceAll(){
  if(S.phase !== 'rpick') return;
  const R = S.race, need = R.ids.filter(id => pl(id) && pl(id).on);
  if(need.every(id => R.slots[id] != null)) setTimeout(() => { if(S.phase === 'rpick') raceRun(); }, 700);
}
function raceRun(){
  if(S.phase !== 'rpick') return;
  clearTimeout(raceTimer);
  const R = S.race, N = R.N;
  const used = new Set(Object.values(R.slots));
  const free = shuffle([...Array(N).keys()].filter(c => !used.has(c)));
  R.ids.forEach(id => { if(R.slots[id] == null) R.slots[id] = free.pop(); });
  R.seed = (Math.random() * 4294967296) >>> 0;
  const sim = raceSim(R.seed, N);
  R.order = sim.order;                              /* 결승선 통과 순서(차 번호) */
  R.f = raceDur(N) / sim.tFirst;                    /* 재생 배속: 1등이 정해진 시간에 들어오도록 */
  const total = RACE_CD + sim.tEnd * R.f;
  S.rk++; S.phase = 'race'; push();
  raceTimer = setTimeout(raceReveal, (total + 2) * 1000);
}
/* 순위 발표 일정: 꼴찌부터 빠르게, 3·2·1위만 조금 뜸 들이기 */
function revTimes(N){
  const t = []; let x = 0.6;
  for(let r = N; r >= 1; r--){
    t.push(x);
    x += r > 3 ? 0.3 : r === 3 ? 0.8 : r === 2 ? 1.0 : 0;
  }
  return { t, end: t[t.length - 1] + 1.8 };
}
function raceReveal(){
  if(S.phase !== 'race') return;
  const R = S.race, tm = revTimes(R.N);
  S.rk++; S.phase = 'rrev'; push();
  raceTimer = setTimeout(raceFinish, tm.end * 1000);
}
function raceFinish(){
  if(S.phase !== 'rrev') return;
  const R = S.race, owner = {};
  Object.entries(R.slots).forEach(([id, c]) => owner[c] = id);
  const rank = R.order.map(c => ({ c, id: owner[c] }));
  const winners = rank.filter((r, i) => R.wr.includes(i + 1)).map(r => r.id);
  finishGame('race', winners, R.ids.slice(), { rank });
}

/* ----- 자동차 레이스: 화면 ----- */
const raceOwner = () => { const o = {}; Object.entries(S.race.slots).forEach(([id, c]) => o[c] = id); return o; };

    <p class="sub" style="margin:4px 0 0">${amIn?`${PICK_SECS}초 안에 내 자동차를 골라요. 못 고르면 랜덤 배정! 순위는 결승선 통과 순서예요.`:'이번 판은 구경만 해요 👀'} (${Object.keys(R.slots).length}/${N}명 선택)</p>
    <p class="sub" style="margin:2px 0 0">당첨 순위: ${roleTxt} · 순위는 꼴찌부터 발표해요</p>

}
function raceHtml(){      /* 레이스 중에는 글자가 바뀌지 않는 틀만 만들고, 안쪽은 직접 갱신 */

function startLadder(){

function ladderCol(id, c){

function checkLadderAll(){

function ladPath(L, c){

function ladderRun(){
  if(S.phase !== 'lpick') return;
  clearTimeout(lpTimer);

  const used = new Set(Object.values(L.slots));
  const free = shuffle([...Array(N).keys()].filter(c => !used.has(c)));
  L.ids.forEach(id => { if(L.slots[id] == null) L.slots[id] = free.pop(); });
  const rows = Math.max(16, Math.min(26, N * 2));
  L.rungs = [];

    for(let c = 0; c < N - 1; c++){

  S.q.subs.push(id); S.picked = S.q.subs.slice();

  if(S.qids.filter(i => pl(i) && pl(i).on).every(i => S.q.subs.includes(i))) closeQuiz();   /* 전원 제출하면 바로 마감 */
}
function quizWinners(){
  return qAns.filter(a => qMark[a.id]).slice(0, S.rule.k).map(a => a.id);   /* 정답자 중 빨리 낸 순서대로 k명 */
}
function finishQuiz(){
  if(S.phase !== 'quiz') return;
  clearTimeout(qTimer);
  const winners = quizWinners();
  finishGame('quiz', winners, S.qids, {
    q: S.q.text,
    answers: qAns.map(a => ({ id: a.id, text: a.text, ok: !!qMark[a.id] }))
  });
}

/* ----- 5초 만들기: 준비 카운트다운 뒤 스톱워치 시작 → 5초라고 느껴질 때 '멈춰!' → 5초에 가까운 순서대로 당첨 ----- */
function startSpeed(){
  ensureBot();
  const ps = S.players.filter(p => p.on);
  if(ps.length < MIN){ toast('최소 2명이 필요해요'); return; }
  const ids = ps.map(p => p.id);
  S.rule = ruleFor('speed', ids.length);
  S.game = 'speed'; S.sp = { ids }; spRes = {};
  S.rk++; S.picked = []; S.phase = 'speed'; S.result = null;
  clearTimeout(spTimer); spTimer = setTimeout(resolveSpeed, (SP_LEAD + SP_LIMIT) * 1000 + 2000);
  push(); botSpeed();
}
function speedPress(id, rt){
  if(S.phase !== 'speed' || !S.sp.ids.includes(id) || spRes[id] != null) return;
  if(!Number.isFinite(rt) || rt < 0 || rt > (SP_LIMIT + 2) * 1000) return;
  spRes[id] = Math.round(rt);                                              /* 시작 후 멈출 때까지 걸린 시간(ms) */
  S.picked = Object.keys(spRes); push();
  checkSpeedAll();
}
function checkSpeedAll(){
  if(S.phase !== 'speed') return;
  const need = S.sp.ids.filter(id => pl(id) && pl(id).on);
  if(need.every(id => spRes[id] != null)) setTimeout(() => { if(S.phase === 'speed') resolveSpeed(); }, 700);
}
function resolveSpeed(){
  if(S.phase !== 'speed') return;
  clearTimeout(spTimer);
  const ids = S.sp.ids;
  const T = SP_TARGET * 1000;
  /* 5초(5000ms)와의 차이가 작은 순서. 5.02초(+0.02)가 4.48초(-0.52)보다 가까우므로 이김 */
  const valid = ids.filter(id => spRes[id] != null).sort((a, b) => Math.abs(spRes[a] - T) - Math.abs(spRes[b] - T));
  const winners = valid.slice(0, S.rule.k);
  finishGame('speed', winners, ids, {
    rank: valid.map(id => ({ id, ms: spRes[id] })),
    miss: ids.filter(id => spRes[id] == null)
  });
}
const fmtSec = ms => (ms / 1000).toFixed(2) + '초';
function spState(){
  const t = Date.now() - rkStart - SP_LEAD * 1000;          /* 스톱워치 시작 후 경과 ms (음수면 준비 중) */
  if(t < 0){ const s = Math.ceil(-t / 1000); return { ready:true, go:false, sec:s, t, txt:String(s) }; }
  return { ready:false, go:true, sec:0, t, txt: t >= SP_SHOW * 1000 ? '?' : (t / 1000).toFixed(2) };
}
function speedPressLocal(){
  if(!S || S.phase !== 'speed' || mySp || !S.sp || !S.sp.ids.includes(myId)) return;
  const st = spState();
  if(st.ready) return;                                       /* 아직 준비 중이면 무시 */
  const rt = st.t;
  if(!act({ t:'sp', rt })) return;
  mySp = { ms: Math.round(rt) }; beep(880, .1); vib(40);
  render();
}

/* ----- 익명투표함 -----
   · 투표 '사실'(vreg, 이름 포함)과 선택 '내용'(v 토픽, 이름 없음)을 서로 다른 메시지로, 무작위 간격을 두고 보냄
   · 방장 기기는 명단(vVoted)과 합계(vTally)를 따로 두고 연결하지 않으며, 개표 전에는 합계를 화면 상태(S)에 싣지 않음 */
function startVote(){
  const q = vDraft.q.trim();
  const opts = vDraft.opts.map(o => o.trim()).filter(Boolean);
  if(!q){ toast('투표 주제를 입력해 주세요'); return; }
  if(opts.length < VMIN){ toast('선택지를 2개 이상 입력해 주세요'); return; }
  if(new Set(opts).size !== opts.length){ toast('같은 선택지가 있어요'); return; }
  ensureBot();
  const ps = S.players.filter(p => p.on);
  if(ps.length < MIN){ toast('최소 2명이 필요해요'); return; }
  vVoted = new Set(); vTally = opts.map(() => 0);
  S.game = 'vote'; S.result = null; S.note = '';
  S.vote = { q: q.slice(0, 60), opts, ids: ps.map(p => p.id), mode: vDraft.mode, closing: false };
  S.secs = VOTE_SECS; S.rk++; S.picked = []; S.phase = 'vote';
  clearTimeout(vTimer);
  if(vDraft.mode === 'time') vTimer = setTimeout(closeVote, VOTE_SECS * 1000 + 500);
  push(); botVote();
}
function botVote(){
  if(!pl(BOT)) return;
  botWait(() => {
    if(S.phase !== 'vote' || !S.vote || S.vote.closing) return;
    if(voteReg(BOT)) voteCount(rnd(S.vote.opts.length));
  }, 1500 + Math.random() * 3000);
}
function voteReg(id){
  if(S.phase !== 'vote' || !S.vote || S.vote.closing || !S.vote.ids.includes(id) || vVoted.has(id)) return false;
  vVoted.add(id); S.picked = Array.from(vVoted); push();
  checkVoteAll();
  return true;
}
function voteCount(c){
  if(S.phase !== 'vote' || !S.vote || !Number.isInteger(c) || c < 0 || c >= S.vote.opts.length) return;
  const sum = vTally.reduce((a, b) => a + b, 0);
  if(sum >= vVoted.size) return;                 /* 등록된 인원보다 많은 표는 받지 않음 */
  vTally[c]++;
}
function checkVoteAll(){
  if(S.phase !== 'vote' || !S.vote || S.vote.closing || S.vote.mode === 'host') return;
  const need = S.vote.ids.filter(id => pl(id) && pl(id).on);
  if(need.every(id => vVoted.has(id))) setTimeout(closeVote, 600);
}
function closeVote(){
  if(S.phase !== 'vote' || !S.vote || S.vote.closing) return;
  clearTimeout(vTimer);
  S.vote.closing = true; push();                  /* 늦게 도착하는 표를 잠깐 기다림 */
  vTimer = setTimeout(finishVote, VOTE_WAIT);
}
function finishVote(){
  if(S.phase !== 'vote' || !S.vote) return;
  const V = S.vote, counts = vTally.slice(), voters = Array.from(vVoted);
  vVoted = new Set(); vTally = [];
  S.phase = 'result';
  S.result = { game:'vote', q:V.q, opts:V.opts, counts, voters, nonvoters:V.ids.filter(id => !voters.includes(id)), pool:V.ids };
  vDraft = { q:'', opts:['', ''], mode: vDraft.mode };
  push();
}
function submitVote(){
  if(!S || S.phase !== 'vote' || myVoted) return;
  if(myVote == null){ toast('선택지를 골라 주세요'); return; }
  const c = myVote;
  if(!act({ t:'vreg' })) return;
  myVoted = true;
  if(isHost) voteCount(c);
  else setTimeout(() => pub('v', { c }), 250 + rnd(1300));      /* 이름 없이 선택만, 무작위 지연 */
  render();
}

/* ============ 화면 그리기 ============ */
function act(o){
  o.id = myId;
  if(isHost){ handleAction(o); return true; }
  if(!cli || !cli.connected){ toast('연결이 잠깐 끊겼어요. 다시 눌러 주세요'); return false; }
  pub('a', o); return true;
}

function chip(id, cls){ const p = pl(id); if(!p) return ''; return `<span class="chip ${cls||''} ${id===myId?'me':''} ${p.on?'':'off'}">${esc(p.name)}</span>`; }
const chips = (ids, cls) => `<div class="chips">${ids.map(id => chip(id, cls)).join('')}</div>`;

function render(){
  if(!room) return;
  if(!S){ $('#stage').innerHTML = '<div class="center sub" style="padding:18px">방에 연결하는 중…</div>'; $('#plist').innerHTML=''; $('#rcnt').textContent=''; lastStageHtml=''; return; }
  if(S.rk !== seenRk){
    seenRk = S.rk; rkStart = Date.now();
    myPick = null; mySp = null; qSent = false; qDraft = ''; qMine = ''; lastSpSec = -1; myVote = null; myVoted = false;
  }
  const online = S.players.filter(p => p.on).length;
  $('#rcnt').textContent = `접속 ${online}/${MAX}명`;

  /* 단계 전환 효과 */
  if(S.phase !== prevPhase){
    if(S.phase === 'count'){ startCount(); drumRoll(3200, .32); }            /* 공개 직전 드럼롤 */
    if(S.phase === 'reveal'){ revealSound(S.reveal); vib(120); }
    if(S.phase === 'quiz' || S.phase === 'vote') beep(660, .2, 'triangle', .2);
    if(S.phase === 'speed') riser(SP_LEAD, .06);
    if(S.phase === 'ladder'){ riser(2.4, .05); drumRoll(2400, .22); }        /* 사다리 공개 */
    if(S.phase === 'rpick') beep(660, .2, 'triangle', .2);
    if(S.phase === 'race'){ riser(RACE_CD, .06); rcState = null; }
    if(S.phase === 'rrev'){ revSeen = -1; drumRoll(900, .2); }
    if(S.phase !== 'race') engineStop();
    if(S.phase === 'result'){ resultSound(S.result); vib([200,80,200]); }
    if(S.phase !== 'ladder'){ ladSeen = {}; lastLadIdx = -2; }
    prevPhase = S.phase;
  }
  if(S.phase === 'ladder' && S.lad && S.lad.rungs) ladderSounds();

  let h = '';
  switch(S.phase){
    case 'lobby': h = lobbyHtml(); break;
    case 'rps': h = rpsHtml(); break;
    case 'count': h = `<h2>${S.game==='rps'?'가위바위보 ':''}공개 직전…</h2><div class="big pulse" id="cnt">${cntVal||''}</div><div class="center sub">모두 선택 완료! 곧 동시에 공개돼요</div>`; break;
    case 'reveal': h = revealHtml(); break;
    case 'lpick': h = lpickHtml(); break;
    case 'ladder': h = ladderHtml(); break;
    case 'quiz': h = quizHtml(); break;
    case 'speed': h = speedHtml(); break;
    case 'rpick': h = rpickHtml(); break;
    case 'race': h = raceHtml(); break;
    case 'rrev': h = rrevHtml(); break;
    case 'vote': h = voteHtml(); break;
    case 'result': h = resultHtml(); break;
  }
  /* 입력창/선택창을 쓰는 중이면 화면을 갈아엎지 않음(입력 내용·펼친 목록 유지) */
  const ae = document.activeElement;
  const typing = ae && $('#stage').contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName);
  const qc = !!(S.phase === 'quiz' && S.q && S.q.closed), qcChanged = qc !== lastQc; lastQc = qc;
  if(qc && qcChanged) timeUp();
  if(typing && S.phase === lastPhaseR && !qcChanged) syncStage(h);     /* 입력 중에도 버튼 활성화/선택지는 최신으로 맞춤 */
  else if(h !== lastStageHtml){ $('#stage').innerHTML = h; lastStageHtml = h; }
  lastPhaseR = S.phase;
  $('#room').dataset.phase = S.phase;

  if(S.phase === 'race') rcKick();

  /* 사다리 캔버스 */
  const showLad = (S.phase === 'ladder' || (S.phase === 'result' && S.lad && S.lad.rungs));
  $('#lwrap').hidden = !showLad;
  if(showLad) ladderUpdate();

  /* 참가자 목록 */
  const picked = (S.phase === 'rps' || S.phase === 'speed' || S.phase === 'vote') ?(S.picked || []) : (S.phase === 'quiz' && S.q ? S.q.subs : (S.phase === 'rpick' && S.race ? Object.keys(S.race.slots) : []));
  $('#plist').innerHTML = `<div class="sub" style="margin-bottom:6px">참가자 ${S.players.length}명</div><div class="chips">` +
    S.players.map(p => {
      const crown = p.id === S.host ? '👑 ' : '';
      const ok = picked.includes(p.id) ? ' ✓' : '';

    }).join('') + '</div>';
  updateBanner();
}

/* 입력/선택 중일 땐 화면을 통째로 바꾸지 않고, 시작 버튼의 활성 여부와 드롭다운 목록만 갱신 */
function syncStage(h){
  const tmp = document.createElement('div'); tmp.innerHTML = h;
  const st = $('#stage'), ae = document.activeElement;
  tmp.querySelectorAll('button[data-a], button[data-go]').forEach(nb => {
    const cb = st.querySelector(nb.dataset.a != null ? `button[data-a="${nb.dataset.a}"]` : `button[data-go="${nb.dataset.go}"]`);
    if(cb) cb.disabled = nb.disabled;
  });
  tmp.querySelectorAll('select[data-cfg]').forEach(ns => {
    const cs = st.querySelector(`select[data-cfg="${ns.dataset.cfg}"]`);
    if(cs && cs !== ae) cs.innerHTML = ns.innerHTML;

  const nh = tmp.querySelector('[data-sync="hint"]'), ch = st.querySelector('[data-sync="hint"]');
  if(ch && !nh) ch.remove();
}

/* ----- 가위바위보 ----- */
function rpsHtml(){
  const alive = S.alive || [];
  const amAlive = alive.includes(myId);

  const conf = S.conf || [];
  let h = `<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h2 style="margin:0">라운드 ${S.round} · 남은 ${alive.length}명</h2><b id="tm" style="font-size:22px;color:var(--red)">${left}</b></div>
    <div class="sub">당첨(진 사람) 총 ${S.rule.k}명 · 확정 ${conf.length}명 · 이번에 더 가릴 인원 ${S.need}명</div>`;
  if(conf.length) h += `<div class="sub" style="margin-top:4px">확정:</div>${chips(conf, 'lose')}`;
  if(S.note) h += `<div class="sub" style="color:var(--red);margin-top:4px">${esc(S.note)}</div>`;
  if(amAlive){
    h += `<p class="sub" style="margin:6px 0 0">${myPick==null?`${RPS_SECS}초 안에 가위·바위·보 중 하나를 고르세요 (못 고르면 랜덤!)`:'선택 완료! 다른 사람을 기다리는 중…'}</p>
      <div class="rps">${SHAPES.map((s,i)=>`<button type="button" data-p="${i}" class="${myPick===i?'sel':''}">${s}<small>${SHAPE_NAME[i]}</small></button>`).join('')}</div>`;

function revealHtml(){
  const R = S.reveal; if(!R) return '';
  const label = R.out === 'draw' ? '🤝 비겼어요!'
    : R.out === 'part' ? `😮 ${R.losers.length}명 당첨 확정!`
    : R.out === 'next' ? `😮 ${R.losers.length}명이 다음 라운드로…` : '😱 최종 결과!';
  const cards = S.alive.map(id => {
    const c = R.choices[id];
    const cls = R.out === 'draw' ? '' : R.losers.includes(id) ? 'lose' : 'win';
    return `<span class="chip pop ${cls} ${id===myId?'me':''}">${SHAPES[c]} ${esc(nm(id))}</span>`;
  }).join('');
  let msg = '';
  if(R.out === 'draw') msg = '모양이 전부 같거나 3가지가 다 나왔어요. 같은 멤버로 다시!';
  else if(R.out === 'part') msg = `진 사람은 당첨 확정! 남은 ${R.need - R.losers.length}명은 이긴 사람들끼리 다시 가려요.`;
  else if(R.out === 'next') msg = `진 사람들끼리 계속합니다. (당첨 ${R.need}명을 가리는 중)`;
  else msg = `당첨 ${S.conf.length + R.losers.length}명이 모두 정해졌어요…`;
  if(R.pair) msg = `세 모양이 다 나와서 랜덤으로 ${SHAPES[R.pair[0]]} vs ${SHAPES[R.pair[1]]} 대결! ` + msg;
  return `<h2 class="center">${label}</h2><div class="rev">${cards}</div><div class="center sub">${msg}</div>`;
}

function voteResultHtml(R){
  const total = R.counts.reduce((a, b) => a + b, 0), mx = Math.max.apply(null, R.counts);
  let h = `<div class="center sub">익명 투표 결과</div><div class="qbox">${esc(R.q)}</div>`;
  if(!total){
    h += `<div class="win-name">아무도 투표하지 않았어요 🤔</div>`;
  }else{
    const tops = R.opts.filter((o, i) => R.counts[i] === mx).map(esc);
    h += `<div class="win-name pop">${tops.length === 1 ? '1위: ' + tops[0] : '공동 1위: ' + tops.join(', ')}</div>`;
  }
  h += R.opts.map((o, i) => {
    const c = R.counts[i], top = total > 0 && c === mx;
    return `<div class="vres"><div class="vrow"><span ${top?'style="font-weight:700"':''}>${esc(o)}</span><span>${c}표</span></div><div class="vtrack"><div class="vfill ${top?'top':''}" style="width:${mx ? Math.round(c / mx * 100) : 0}%"></div></div></div>`;
  }).join('');
  h += `<div class="sub" style="margin-top:6px">총 ${total}표${R.nonvoters.length ? ` · 투표하지 않은 사람 ${R.nonvoters.length}명` : ''}</div>`;
  h += `<div class="sub" style="margin-top:12px">투표에 참여한 사람 (${R.voters.length}명)</div>${chips(R.voters, 'win')}`;
  h += `<div class="rulebar sub" style="margin-top:12px">🔒 누가 어디에 투표했는지는 기록되지 않아요. 합계만 남고, 이 화면을 닫으면 사라져요.</div>`;

  return h;
}

/* ----- 결과 ----- */
function resultHtml(){
  const R = S.result; if(!R) return '';
  if(R.game === 'vote') return voteResultHtml(R);
  let h =`<div class="center sub">${GAME_NAME[R.game]} 결과</div>`;
  if(R.void){
    h += `<div class="win-name">${R.game==='quiz'?'정답자가 없어요 🤔':'아무도 못 눌렀어요 🤔'}</div><div class="center sub">무효 처리! 다시 해볼까요?</div>`;
  }else{
    const pn = R.payers.map(id => esc(nm(id)));
    const head = !pn.length ? '모두 면제! 🎉' : (pn.length <= 3 ? pn.join(', ') : `${pn.slice(0,3).join(', ')} 외 ${pn.length-3}명`) + ' 님이 쏩니다!';
    const iPay = R.payers.includes(myId), inPool = R.pool.includes(myId);
    h += `<div class="win-name pop">${pn.length?'☕ ':''}${head}</div>
      <div class="center">${!inPool?'':(iPay?'아이고… 잘 마실게요 😆':'살았다! 😎')}</div>`;
    const grp = (label, ids, cls) => ids.length ? `<div class="sub" style="margin-top:10px">${label} (${ids.length}명)</div>${chips(ids, cls)}` : '';
    const rest = R.pool.filter(id => !R.winners.includes(id));
    if(R.role === 'pay') h += grp('당첨 → 쏘는 사람', R.winners, 'lose') + grp('면제', rest, 'win');
    else h += grp('당첨 → 면제', R.winners, 'win') + grp('쏘는 사람', R.payers, 'lose');
  }
  if(R.game === 'speed'){
    h += `<div class="sub" style="margin-top:12px">${SP_TARGET}초에 가까운 순서 (오차)</div>` +
      (R.rank.length ? R.rank.map((r, i) => { const d = r.ms - SP_TARGET * 1000; return `<div class="rrow ${R.winners.includes(r.id)?'w':''}"><b>${i+1}</b><span>${esc(nm(r.id))}${R.winners.includes(r.id)?' <span class="badge">당첨</span>':''}</span><span>${fmtSec(r.ms)} (${d >= 0 ? '+' : '-'}${(Math.abs(d) / 1000).toFixed(2)})</span></div>`; }).join('') : '<div class="sub">기록 없음</div>');
    if(R.miss.length) h += `<div class="sub" style="margin-top:4px">😴 못 눌렀어요: ${R.miss.map(id => esc(nm(id))).join(', ')}</div>`;
  }
  if(R.game === 'race' && R.rank){
    h += `<div class="sub" style="margin-top:12px">최종 순위</div><div class="vlist">` + R.rank.map((r, i) => {
      const win = R.winners.includes(r.id);
      return `<div class="vrow ${win?'w':''} ${r.id===myId?'me':''}"><b>${i+1}</b><i class="sw" style="background:${CARS[r.c][1]}"></i><span class="cn">${CARS[r.c][0]}</span>${win?'<span class="badge">당첨</span>':''}<span class="on">${esc(nm(r.id))}</span></div>`;
    }).join('') + '</div>';
  }
  if(R.game === 'quiz'){
    h += `<div class="sub" style="margin-top:12px">문제: ${esc(R.q)}</div>` +
      (R.answers.length ? R.answers.map((a, i) => `<div class="arow ${a.ok?'ok':''}"><b>${i+1}</b><span class="who">${esc(nm(a.id))}${R.winners.includes(a.id)?'<span class="badge">당첨</span>':''}</span><span class="atx">${esc(a.text)}</span><span>${a.ok?'✓':''}</span></div>`).join('') : '<div class="sub">제출된 답변이 없어요</div>');
  }
  h += tallyHtml();
  const more = R.game === 'quiz' && S.qs && S.qs.i < S.qs.n;
  if(isHost){
    if(more) h += `<div class="sub" style="margin-top:14px">다음 문제 (${S.qs.i + 1}/${S.qs.n})</div>
      <input type="text" id="qText" maxlength="80" placeholder="다음 문제를 입력하세요" value="${esc(qText)}" style="margin-top:6px">
      <div style="display:flex;gap:8px;margin-top:8px"><button class="btn" type="button" data-a="lobby" style="flex:1">그만하기</button><button class="btn pri" type="button" data-a="quizNext" style="flex:2">다음 문제 시작</button></div>`;
    else h += `<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" type="button" data-a="lobby" style="flex:1">게임 선택</button><button class="btn pri" type="button" data-a="again" style="flex:2">${R.game==='quiz'?'퀴즈 다시 하기':'한 판 더'}</button></div>`;
  }else if(more) h += `<p class="center sub" style="margin-top:12px">방장이 다음 문제(${S.qs.i + 1}/${S.qs.n})를 내는 중…</p>`;
  return h;
}

function ladderSounds(){
  const L = S.lad;
  if(L.idx >= 0 && L.idx !== lastLadIdx){
    lastLadIdx = L.idx;
    const id = L.order[L.idx];
    if(!L.res[id]) runnerSound(L.dur, L.order.length - L.idx - 1 <= 1);
  }
  for(const id in L.res){
    if(!ladSeen[id]){ ladSeen[id] = 1; if(L.res[id] === 'hit'){ stingHit(); vib([120, 60, 120]); } else relief(); }
  }
}
function startCount(){
  clearInterval(cntTimer); cntVal = 3; beep(520, .15);
  cntTimer = setInterval(() => {
    cntVal--;
    const el = $('#cnt'); if(el) el.textContent = cntVal > 0 ? cntVal : '';
    if(cntVal > 0) beep(520 + (3 - cntVal) * 120, .15);
    if(cntVal <= 0) clearInterval(cntTimer);
  }, 1000);
}
/* ---- 남은 시간 / 스피드 카운트다운 표시 ---- */
setInterval(() => {
  if(!S) return;
  if(S.phase === 'rps' || S.phase === 'lpick' || S.phase === 'rpick' || (S.phase === 'quiz' && S.q && !S.q.closed) || (S.phase === 'vote' && S.vote && S.vote.mode === 'time' && !S.vote.closing)){
    const el = $('#tm'); if(!el) return;
    const left = Math.max(0, S.secs - Math.floor((Date.now() - rkStart) / 1000));
    if(el.textContent !== String(left)){
      el.textContent = left; if(left <= 2 && left > 0) beep(700, .06, 'square', .08);
      /* 퀴즈: 시간이 끝났는데 입력해 둔 답이 있으면 자동 제출 */
      if(left === 0 && S.phase === 'quiz' && !isHost && S.qids && S.qids.includes(myId) && !qSent && !S.q.subs.includes(myId)){
        const inp = $('#qAns'); if(inp && inp.value.trim()) submitAnswer();
      }
    }
  }else if(S.phase === 'rrev' && S.race){
    const n = revCount();
    if(n !== revSeen){
      const first = revSeen < 0;
      revSeen = n;
      if(n > 0){
        const r = S.race.N - n + 1, win = S.race.wr.includes(r);
        if(r === 3){ kick(0, .5); bell(523, 0, .14); vib(60); }
        else if(r === 2){ snare(0, .35); bell(659, 0, .16); vib(60); }
        else if(r === 1){ kick(0, .6); [523, 659, 784, 1047].forEach(f => tone(f, .8, 'triangle', .13, .05)); cheer(1.2, .18, .05); vib([120, 60, 120]); }
        else if(win){ kick(0, .35); tone(220, .15, 'square', .07); }
        else tone(700 + (n % 7) * 60, .07, 'triangle', .13);
        if(r <= 3 && win) tone(110, .6, 'sawtooth', .15, .02, 52);
      }
      render();
      const e = $('#rv-last'); if(e && e.scrollIntoView) e.scrollIntoView({ block:'center', behavior: first ? 'auto' : 'smooth' });
    }
  }else if(S.phase === 'speed'){
    const st = spState();
    const c = $('#spc'), txt = mySp ? (mySp.ms / 1000).toFixed(2) : st.txt;
    if(c && c.textContent !== txt) c.textContent = txt;
    const b = $('#spb');
    if(b){ b.classList.toggle('go', st.go); if(!mySp){ const l = st.ready ? '준비…' : '멈춰!'; if(b.textContent !== l) b.textContent = l; } }
    if(st.sec !== lastSpSec){
      lastSpSec = st.sec;
      if(st.sec > 0) beep(480 + (SP_LEAD - st.sec) * 90, .1);
      else{ beep(1200, .25, 'square', .25); vib(80); }
    }
  }
}, 50);

/* ============ 사다리 캔버스 ============ */
const cv = $('#cv'), ctx = cv.getContext('2d');
let animIdx = -2, animT0 = 0, rafOn = false;

function ladderUpdate(){
  const L = S.lad; if(!L || !L.rungs) return;
  if(S.phase === 'ladder' && L.idx >= 0 && L.idx !== animIdx && !L.res[L.order[L.idx]]){
    animIdx = L.idx; animT0 = performance.now();
  }
  if(S.phase === 'ladder' && L.idx < 0) animIdx = -1;
  drawLadder(performance.now());
  if(!rafOn){ rafOn = true; requestAnimationFrame(tick); }
}
function tick(t){
  rafOn = false;
  if(!S || !S.lad || !S.lad.rungs || $('#lwrap').hidden) return;
  const L = S.lad;
  const active = S.phase === 'ladder' && L.idx >= 0 && !L.res[L.order[L.idx]];
  drawLadder(t);
  if(active){ rafOn = true; requestAnimationFrame(tick); }
}
function drawLadder(now){
  const L = S.lad; if(!L || !L.rungs) return;
  const N = L.N, rows = L.rungs.length;
  const wrapW = $('#lscroll').clientWidth || 320;
  const colW = (N * 44 <= wrapW) ? Math.min(wrapW / N, 140) : 44;
  const top = 38, bot = 44, rowH = wrapW > 700 ? 28 : 16;
  const W = Math.ceil(colW * N), H = top + rows * rowH + bot;
  const dpr = window.devicePixelRatio || 1;
  if(cv.width !== W * dpr || cv.height !== H * dpr){
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const X = c => colW * (c + .5), Y = r => top + r * rowH;
  const idOfCol = {}; Object.entries(L.slots).forEach(([id, c]) => idOfCol[c] = id);

  /* 세로선 / 가로선 */
  ctx.lineWidth = 2; ctx.strokeStyle = '#bfc1b7'; ctx.lineCap = 'round';
  for(let c = 0; c < N; c++){ ctx.beginPath(); ctx.moveTo(X(c), Y(0)); ctx.lineTo(X(c), Y(rows)); ctx.stroke(); }
  L.rungs.forEach((row, r) => row.forEach(c => { ctx.beginPath(); ctx.moveTo(X(c), Y(r + .5)); ctx.lineTo(X(c + 1), Y(r + .5)); ctx.stroke(); }));

  /* 위쪽 이름 */
  ctx.textAlign = 'center'; ctx.font = '600 12px sans-serif';
  for(let c = 0; c < N; c++){
    const id = idOfCol[c]; const isMe = id === myId;
    ctx.fillStyle = isMe ? '#cd8407' : '#23251d';
    ctx.font = (isMe ? '800 ' : '600 ') + '12px sans-serif';
    ctx.fillText(id ? short(nm(id)) : String(c + 1), X(c), 22);
  }

  /* 끝난 사람 경로 + 열린 칸 */
  const openEnd = {};
  const polyline = (pts, color, w) => {
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath();
    pts.forEach(([c, r], i) => { const x = X(c), y = Y(r); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
  };
  Object.entries(L.res).forEach(([id, r]) => {
    const p = ladPath(L, L.slots[id]);
    openEnd[p.end] = r;
    if(!L.done || S.phase !== 'result') polyline(p.pts, r === 'hit' ? 'rgba(200,68,47,.75)' : 'rgba(75,138,51,.55)', 4);
  });

  /* 진행 중인 경로 */
  if(S.phase === 'ladder' && L.idx >= 0){
    const id = L.order[L.idx];
    if(!L.res[id]){
      const p = ladPath(L, L.slots[id]);
      const prog = Math.min(1, (now - animT0) / (L.dur || 2500));
      const seg = []; let total = 0;
      for(let i = 1; i < p.pts.length; i++){
        const a = p.pts[i-1], b = p.pts[i];
        const len = Math.hypot(X(b[0]) - X(a[0]), Y(b[1]) - Y(a[1]));
        seg.push(len); total += len;
      }
      let target = prog * total, cur = [p.pts[0]];
      for(let i = 0; i < seg.length; i++){
        const a = p.pts[i], b = p.pts[i+1];
        if(target >= seg[i]){ cur.push(b); target -= seg[i]; }
        else{ const f = seg[i] ? target / seg[i] : 0; cur.push([a[0] + (b[0]-a[0])*f, a[1] + (b[1]-a[1])*f]); break; }
      }
      polyline(cur, '#eb9d2a', 5);
      const head = cur[cur.length - 1];
      ctx.fillStyle = '#cd8407'; ctx.beginPath(); ctx.arc(X(head[0]), Y(head[1]), 7, 0, 7); ctx.fill();
      const sc = $('#lscroll'); const hx = X(head[0]);
      if(sc.scrollWidth > sc.clientWidth) sc.scrollLeft = hx - sc.clientWidth / 2;
    }
  }

  /* 아래쪽 결과 칸 */
  ctx.textAlign = 'center';
  for(let c = 0; c < N; c++){
    const revealed = L.done || openEnd[c] != null;
    const x = X(c), y = Y(rows) + 8;
    const w = Math.min(colW - 6, 40);
    let fill = '#eeefe9', txt = '?', col = '#65675e';
    if(revealed){ if(L.bot[c]){ fill = '#c8442f'; txt = '당첨'; col = '#fff'; } else { fill = '#dcebd3'; txt = '통과'; col = '#2f5a1f'; } }
    ctx.fillStyle = fill; ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x - w/2, y, w, 26, 6); else ctx.rect(x - w/2, y, w, 26);
    ctx.fill();
    ctx.fillStyle = col; ctx.font = '700 12px sans-serif'; ctx.fillText(txt, x, y + 17);
  }
}

/* 스피드 버튼은 손가락이 닿는 순간(pointerdown)에 반응 */
$('#stage').addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sp]'); if(!b || b.disabled) return;
  e.preventDefault(); speedPressLocal();
});
$('#stage').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || b.disabled) return;
  if(b.dataset.sp != null) return;
  keepAwake();
  uiClick();
  if(b.dataset.p != null){ const c = +b.dataset.p; if(act({t:'pick', c})) myPick = c; render(); return; }
  if(b.dataset.c != null){ act({t:'col', c: +b.dataset.c}); return; }
  if(b.dataset.car != null){ act({t:'car', c: +b.dataset.car}); return; }
  if(b.dataset.mark != null){ qMark[b.dataset.mark] = !qMark[b.dataset.mark]; render(); return; }
  if(b.dataset.go != null){ setupGame = b.dataset.go; render(); return; }
  if(b.dataset.vo != null){ myVote = +b.dataset.vo; render(); return; }
  if(b.dataset.vm != null || b.dataset.vadd != null || b.dataset.vdel != null){
    if(b.dataset.vm != null) vDraft.mode = b.dataset.vm;
    else if(b.dataset.vadd != null){ if(vDraft.opts.length < VMAX) vDraft.opts.push(''); }
    else if(vDraft.opts.length > VMIN) vDraft.opts.splice(+b.dataset.vdel, 1);
    try{ document.activeElement.blur(); }catch(e){}       /* 입력창 포커스를 풀어야 화면이 다시 그려짐 */
    render(); return;
  }
  if(b.dataset.rm != null){ cfg.rmode = b.dataset.rm; render(); return; }
  if(b.dataset.rk != null){ const r = +b.dataset.rk, i = cfg.rk.indexOf(r); if(i >= 0) cfg.rk.splice(i, 1); else cfg.rk.push(r); render(); return; }
  if(b.dataset.rkp != null){
    const N = Math.max(2, S.players.filter(p => p.on).length), k = ruleFor('race', N).k, all = [...Array(N).keys()].map(i => i + 1);
    cfg.rk = b.dataset.rkp === 'last' ? all.slice(N - k) : b.dataset.rkp === 'first' ? all.slice(0, k) : shuffle(all).slice(0, k);
    render(); return;
  }
  if(b.dataset.lm != null){ cfg.lmode = b.dataset.lm; store.set('ds_lmode', cfg.lmode); render(); return; }
  if(b.dataset.mv != null){ const [mid, md] = b.dataset.mv.split('|'); moveLad(mid, +md); return; }
  switch(b.dataset.a){
    case 'rps': startRps(); break;
    case 'ladder': startLadder(); break;
    case 'quiz': startQuiz(); break;
    case 'speed': startSpeed(); break;
    case 'vote': startVote(); break;
    case 'race': startRace(); break;
    case 'raceGo': raceRun(); break;
    case 'vsub': submitVote(); break;
    case 'vclose': closeVote(); break;
    case 'ladderGo': ladderRun(); break;
    case 'ladShuffle': shuffleLad(); break;
    case 'ladStart': startLadHost(); break;
    case 'quizEnd': finishQuiz(); break;
    case 'quizNext': startQuiz(true); break;
    case 'back': setupGame = null; render(); break;
    case 'again': { const g = S.game; toLobby(); setupGame = g; render(); break; }
    case 'ans': submitAnswer(); break;
    case 'lobby': setupGame = null; toLobby(); break;
    case 'close': if(confirm('방을 닫을까요?')) leaveRoom(false); break;
  }
});
